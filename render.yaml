# ============================================
# Render.com Deployment Configuration
# منصة إدارة العمليات الإسعافية – قطاع جنوب الرياض
# ============================================

services:
  - type: web
    name: ambulance-management-system
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # النشر اليدوي فقط حتى اكتمال اعتماد الجاهزية؛ لا يبدأ نشر بمجرد رفع Git.
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: '10000'
      - key: RENDER_DISK_PATH
        value: /data
      - key: DATA_DIR
        value: /data
      - key: DB_PATH
        value: /data/ambulance.db
      - key: SCHEDULE_FILE
        value: /data/schedule-employees.json
      - key: BACKUP_DIR
        value: /data/backups
      # قيمة سرية إلزامية تُدخل في Render Dashboard؛ لا تخزن في Git.
      - key: JWT_SECRET
        sync: false
      # كلمات مرور الحسابات الافتراضية تبقى أسرارًا مستقلة عند الحاجة.
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_DIRECTOR_PASSWORD
        sync: false
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://emsoperations.online
    disk:
      name: ambulance-data-disk
      mountPath: /data
      sizeGB: 10

# لا تضف cronJobs للنسخ الاحتياطي هنا: Render Cron Jobs لا يمكنها تركيب
# القرص الدائم أو الوصول إلى /data الخاص بالخدمة. النسخ قبل النشر وبعده
# يتم من Shell الخاص بالخدمة أو بآلية خارجية موثوقة ومصادق عليها.
# لا تضف preDeployCommand للترحيل: أوامر pre-deploy لا تصل إلى القرص.
# الترحيل الإضافي موثق في deploy/migrations ويُختبر قبل أي نشر فعلي.

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>منصة بلاغ - إحصاء الفرق الإسعافية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #eef2f7;
            margin: 0;
            padding: 8px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: auto;
        }
        /* رأس الصفحة */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #1e466e;
            margin: 0;
            font-size: 1.5rem;
        }
        .header .sub {
            color: #2a7f3e;
            margin: 5px 0 0;
            font-size: 0.8rem;
        }
        /* شريط اختيار القطاع */
        .sector-bar {
            background: white;
            border-radius: 60px;
            padding: 8px 15px;
            margin-bottom: 15px;
            display: flex;
justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .sector-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sector-btn {
            background: #e0e7ff;
            color: #1e466e;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .sector-btn.active {
            background: #1e466e;
            color: white;
        }
        .total-badge {
            background: #1e466e;
            color: white;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .total-badge span {
            font-size: 1.4rem;
            margin-left: 5px;
            color: #ffd966;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 5px 12px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .export-btn { background: #2a7f3e; color: white; }
        .reset-btn { background: #c0392b; color: white; }
        .backup-btn { background: #e67e22; color: white; }
        .restore-btn { background: #2c3e50; color: white; }
        /* بطاقات المراكز */
        .point-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 12px;
            padding: 8px 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .point-title {
            margin: 0 0 8px 0;
            font-size: 1rem;
            font-weight: bold;
            color: #1e466e;
            border-right: 4px solid #b22234;
            padding-right: 8px;
        }
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 6px;
        }
        .unit-card {
            background: #f9fafc;
            border-radius: 12px;
            padding: 5px 4px;
            text-align: center;
            border: 1px solid #e8ecf2;
        }
        .unit-card:active { transform: scale(0.97); }
        .unit-name {
            font-size: 0.75rem;
            font-weight: bold;
            background: #1e466e;
            color: white;
            padding: 3px;
            border-radius: 25px;
            margin-bottom: 4px;
        }
        .count-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: #b22234;
            margin: 2px 0;
            line-height: 1.2;
        }
        .report-btn {
            background: #2a7f3e;
            color: white;
            border: none;
            padding: 4px;
            width: 100%;
            font-size: 0.65rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 3px 0;
        }
        .show-times-btn {
            background: #4a6a8b;
            color: white;
            border: none;
            padding: 3px;
            width: 100%;
            font-size: 0.6rem;
            border-radius: 20px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 350px;
            width: 85%;
            padding: 12px;
            text-align: center;
        }
        .modal-content h3 { margin: 0 0 6px 0; font-size: 1rem; }
        .modal-times {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 8px;
            max-height: 250px;
            overflow-y: auto;
            text-align: right;
            margin: 10px 0;
        }
        .modal-times p { margin: 4px 0; font-size: 0.75rem; }
        .close-modal {
            background: #4a6a8b;
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        footer {
            text-align: center;
            margin-top: 10px;
            font-size: 0.6rem;
            color: #5a6e7c;
        }
        @media (max-width: 550px) {
            .units-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; }
            .unit-name { font-size: 0.65rem; }
            .count-number { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>منصة بلاغ</h1>
        <div class="sub">إحصاء بلاغات الفرق الإسعافية</div>
    </div>

    <div class="sector-bar">
        <div class="sector-selector" id="sectorSelector">
            <button class="sector-btn active" data-sector="south">📍 الجنوب</button>
            <button class="sector-btn" data-sector="north">⬆️ الشمال</button>
            <button class="sector-btn" data-sector="east">➡️ الشرق</button>
            <button class="sector-btn" data-sector="west">⬅️ الغرب</button>
            <button class="sector-btn" data-sector="central">🟢 الوسط</button>
        </div>
        <div class="total-badge">📊 الإجمالي <span id="grandTotal">0</span></div>
        <div class="toolbar">
            <button class="backup-btn" id="backupBtn">📥 نسخة احتياطية</button>
            <button class="restore-btn" id="restoreBtn">📤 استعادة نسخة</button>
            <button class="export-btn" id="exportBtn">📎 تصدير Excel</button>
            <button class="reset-btn" id="resetBtn">🗑️ تصفير</button>
        </div>
    </div>

    <div id="pointsContainer"></div>
    <footer>⏱️ ضغطة = بلاغ + وقت | البيانات لكل قطاع منفصلة | يثبت كتطبيق على الجهاز</footer>
</div>

<div id="timeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalUnitName">الوحدة</h3>
        <div id="modalTimesList" class="modal-times"></div>
        <button class="close-modal" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    // ============================================
    // بيانات كل قطاع (أضف أو عدل كما تشاء)
    // ============================================
    const sectorsData = {
        south: {
            name: "الجنوب",
            centers: {
                "مركز المنصورة": ["جنوب 1", "جنوب 11", "جنوب 12", "سريع 3"],
                "مركز الخالدية": ["جنوب 2"],
                "مركز منفوحة": ["جنوب 3"],
                "مركز الدار البيضاء": ["جنوب 4", "جنوب 5", "سريع 1"],
                "مركز الإسكان": ["جنوب 6"],
                "مركز الحائر": ["جنوب 7"],
                "مركز ديراب": ["جنوب 10"],
                "مركز عكاظ": ["جنوب 9"],
                "مركز الشفاء": ["جنوب 8", "سريع 2"],
                "Overlap": ["سريع 4", "جنوب 13", "جنوب 14", "جنوب 15", "جنوب 16", "جنوب 17", "جنوب 18", "جنوب 19"]
            }
        },
        north: {
            name: "الشمال",
            centers: {
                "مركز الروضة": ["شمال 1", "شمال 2", "سريع 5"],
                "مركز النرجس": ["شمال 3", "شمال 4"],
                "مركز العارض": ["شمال 5", "سريع 6"]
            }
        },
        east: {
            name: "الشرق",
            centers: {
                "مركز النسيم": ["شرق 1", "شرق 2", "سريع 7"],
                "مركز الروابي": ["شرق 3", "شرق 4"]
            }
        },
        west: {
            name: "الغرب",
            centers: {
                "مركز الدار": ["غرب 1", "غرب 2", "سريع 8"],
                "مركز السويدي": ["غرب 3", "غرب 4"]
            }
        },
        central: {
            name: "الوسط",
            centers: {
                "مركز البطحاء": ["وسط 1", "وسط 2", "سريع 9"],
                "مركز المربع": ["وسط 3", "وسط 4"]
            }
        }
    };

    let currentSector = "south";
    let allReports = {};

    // تحميل البيانات من IndexedDB
    async function loadReports() {
        let saved = await loadFromIndexedDB();
        if (saved) {
            allReports = saved;
        }
        // تأكد من وجود كل القطاعات والوحدات
        for (let sector in sectorsData) {
            if (!allReports[sector]) allReports[sector] = {};
            for (let center in sectorsData[sector].centers) {
                for (let unit of sectorsData[sector].centers[center]) {
                    let key = `${center}|${unit}`;
                    if (!allReports[sector][key]) {
                        allReports[sector][key] = { count: 0, times: [] };
                    }
                }
            }
        }
        await saveToIndexedDB(allReports);
        renderCurrentSector();
        updateTotal();
    }

    function openDB() {
        return new Promise((resolve, reject) => {
            let request = indexedDB.open("AmbulanceDB_MultiSector", 1);
            request.onupgradeneeded = () => {
                let db = request.result;
                if (!db.objectStoreNames.contains("reports")) {
                    db.createObjectStore("reports", { keyPath: "id" });
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveToIndexedDB(data) {
        let db = await openDB();
        let tx = db.transaction("reports", "readwrite");
        let store = tx.objectStore("reports");
        store.put({ id: "mainData", value: data });
        return new Promise(resolve => tx.oncomplete = resolve);
    }

    async function loadFromIndexedDB() {
        let db = await openDB();
        let tx = db.transaction("reports", "readonly");
        let store = tx.objectStore("reports");
        let request = store.get("mainData");
        return new Promise(resolve => {
            request.onsuccess = () => resolve(request.result?.value || null);
            request.onerror = () => resolve(null);
        });
    }

    function getCurrentReports() {
        if (!allReports[currentSector]) allReports[currentSector] = {};
        return allReports[currentSector];
    }

    function updateTotal() {
        let reports = getCurrentReports();
        let total = 0;
        for (let key in reports) total += reports[key].count;
        document.getElementById("grandTotal").innerText = total;
    }

    async function addReport(center, unit) {
        let key = `${center}|${unit}`;
        let reports = getCurrentReports();
        if (!reports[key]) reports[key] = { count: 0, times: [] };
        
        let now = new Date();
        let year = now.getFullYear();
        let month = (now.getMonth()+1).toString().padStart(2,'0');
        let day = now.getDate().toString().padStart(2,'0');
        let hours = now.getHours().toString().padStart(2,'0');
        let minutes = now.getMinutes().toString().padStart(2,'0');
        let seconds = now.getSeconds().toString().padStart(2,'0');
        let fullDateTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        
        reports[key].count++;
        reports[key].times.unshift(fullDateTime);
        if (reports[key].times.length > 8) reports[key].times.pop();
        
        await saveToIndexedDB(allReports);
        renderCurrentSector();
        updateTotal();
    }

    function showTimes(center, unit) {
        let key = `${center}|${unit}`;
        let reports = getCurrentReports();
        let times = reports[key]?.times || [];
        document.getElementById("modalUnitName").innerText = `${center} - ${unit}`;
        let modalList = document.getElementById("modalTimesList");
        modalList.innerHTML = times.length ? times.map(t => `<p>🕒 ${t}</p>`).join("") : "<p style='color:gray;'>⏳ لا توجد بلاغات</p>";
        document.getElementById("timeModal").style.display = "flex";
    }

    function closeModal() { document.getElementById("timeModal").style.display = "none"; }

    async function resetAll() {
        if (confirm("⚠️ تصفير جميع البلاغات في قطاع " + sectorsData[currentSector].name + "؟")) {
            allReports[currentSector] = {};
            await saveToIndexedDB(allReports);
            renderCurrentSector();
            updateTotal();
        }
    }

    async function backupData() {
        let backup = {
            date: new Date().toISOString(),
            reports: allReports,
            version: "2.0"
        };
        let blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `بلاغ_${sectorsData[currentSector].name}_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function restoreData() {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json";
        input.onchange = async (e) => {
            let file = e.target.files[0];
            let text = await file.text();
            try {
                let backup = JSON.parse(text);
                if (backup.reports) {
                    allReports = backup.reports;
                    await saveToIndexedDB(allReports);
                    renderCurrentSector();
                    updateTotal();
                    alert("✅ تم استعادة النسخة الاحتياطية بنجاح");
                } else {
                    alert("❌ الملف غير صالح");
                }
            } catch(err) {
                alert("❌ خطأ في قراءة الملف");
            }
        };
        input.click();
    }

    function exportExcel() {
        let reports = getCurrentReports();
        let sectorName = sectorsData[currentSector].name;
        let rows = [
            [`تقرير بلاغات الفرق - قطاع ${sectorName}`],
            ["تاريخ التصدير:", new Date().toLocaleString("ar-SA")],
            [],
            ["المركز", "الوحدة", "عدد البلاغات", "التواقيت"]
        ];
        for (let center in sectorsData[currentSector].centers) {
            for (let unit of sectorsData[currentSector].centers[center]) {
                let key = `${center}|${unit}`;
                let r = reports[key] || { count: 0, times: [] };
                rows.push([center, unit, r.count, r.times.join(" ؛ ") || "لا يوجد"]);
            }
        }
        let total = 0;
        for (let key in reports) total += reports[key].count;
        rows.push([], ["الإجمالي", "", total, ""]);
        
        let csv = rows.map(row => row.map(cell => `"${String(cell||"").replace(/"/g,'""')}"`).join(",")).join("\n");
        let blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `بلاغات_${sectorName}_${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function renderCurrentSector() {
        let container = document.getElementById("pointsContainer");
        container.innerHTML = "";
        let sector = sectorsData[currentSector];
        let reports = getCurrentReports();
        
        for (let center in sector.centers) {
            let pointDiv = document.createElement("div");
            pointDiv.className = "point-card";
            pointDiv.innerHTML = `<div class="point-title">📍 ${center}</div><div class="units-grid" id="grid-${center.replace(/\s/g, '')}"></div>`;
            container.appendChild(pointDiv);
            
            let grid = pointDiv.querySelector(".units-grid");
            for (let unit of sector.centers[center]) {
                let key = `${center}|${unit}`;
                let info = reports[key] || { count: 0, times: [] };
                let unitDiv = document.createElement("div");
                unitDiv.className = "unit-card";
                unitDiv.innerHTML = `
                    <div class="unit-name">${unit}</div>
                    <div class="count-number">${info.count}</div>
                    <button class="report-btn">➕ بلاغ</button>
                    <button class="show-times-btn">📋 التواقيت</button>
                `;
                unitDiv.querySelector(".report-btn").onclick = (() => addReport(center, unit));
                unitDiv.querySelector(".show-times-btn").onclick = (() => showTimes(center, unit));
                grid.appendChild(unitDiv);
            }
        }
    }

    function switchSector(sectorId) {
        currentSector = sectorId;
        // تحديث حالة الأزرار
        document.querySelectorAll('.sector-btn').forEach(btn => {
            if (btn.dataset.sector === sectorId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderCurrentSector();
        updateTotal();
    }

    // ربط الأحداث
    window.onclick = (e) => { if (e.target === document.getElementById("timeModal")) closeModal(); };
    document.getElementById("exportBtn").onclick = exportExcel;
    document.getElementById("resetBtn").onclick = resetAll;
    document.getElementById("backupBtn").onclick = backupData;
    document.getElementById("restoreBtn").onclick = restoreData;
    
    document.querySelectorAll('.sector-btn').forEach(btn => {
        btn.onclick = () => switchSector(btn.dataset.sector);
    });
    
    // بدء التشغيل
    loadReports();
</script>
</body>
</html>

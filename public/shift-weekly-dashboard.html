<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="لوحة تحكم أسبوعية - منصة إدارة العمليات الإسعافية – قطاع جنوب الرياض">
    <title>لوحة التحكم الأسبوعية | منصة الجنوب</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#1E3A5F">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/shift-dashboard.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #F8FAFC; color: #1E293B; min-height: 100vh; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F1F5F9; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
        .week-display { font-weight: 700; font-size: 1.1rem; color: #1E293B; min-width: 180px; text-align: center; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="dashboard-page">
    <div class="dashboard-top-bar">
        <a href="/" class="dashboard-logo"><i class="fas fa-ambulance"></i><span>منصة الجنوب</span></a>
        <div class="dashboard-top-bar-center"><div class="dashboard-live-clock" id="liveClock">--</div></div>
        <div class="dashboard-top-bar-actions">
            <a href="/" class="dashboard-btn"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="/shift-daily-dashboard.html" class="dashboard-btn"><i class="fas fa-calendar-day"></i> يومي</a>
            <a href="/shift-archive.html" class="dashboard-btn"><i class="fas fa-archive"></i> الأرشيف</a>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="dashboard-title"><i class="fas fa-calendar-week"></i> لوحة التحكم الأسبوعية</div>

        <div class="filter-bar">
            <div class="filter-group" style="flex:0; min-width:120px;">
                <button class="dashboard-btn" onclick="changeWeek(-7)"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="filter-group" style="flex:0; min-width:200px;">
                <div class="week-display" id="weekDisplay">--</div>
            </div>
            <div class="filter-group" style="flex:0; min-width:120px;">
                <button class="dashboard-btn" onclick="changeWeek(7)"><i class="fas fa-chevron-left"></i></button>
            </div>
            <div class="filter-group" style="flex:0; min-width:160px;">
                <input type="date" id="weekInput" onchange="setWeekFromInput()" />
            </div>
            <div class="filter-group" style="flex:0; min-width:120px;">
                <button class="dashboard-btn dashboard-btn-primary" onclick="loadWeekly()"><i class="fas fa-sync"></i> تحديث</button>
            </div>
            <div class="filter-group" style="flex:0; min-width:120px;">
                <button class="dashboard-btn" onclick="exportWeeklyPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            </div>
            <div class="filter-group" style="flex:0; min-width:120px;">
                <button class="dashboard-btn" onclick="exportWeeklyExcel()"><i class="fas fa-file-excel"></i> Excel</button>
            </div>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="charts-grid">
            <div class="chart-section">
                <div class="chart-header"><div class="chart-title"><i class="fas fa-chart-bar"></i> البلاغات حسب اليوم</div></div>
                <div class="chart-container"><canvas id="dailyChart"></canvas></div>
            </div>
            <div class="chart-section">
                <div class="chart-header"><div class="chart-title"><i class="fas fa-chart-line"></i> اتجاه الإنجاز</div></div>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
            </div>
        </div>

        <div class="chart-section" style="padding:0; overflow:hidden;">
            <div class="chart-header" style="padding:16px 20px; border-bottom:1px solid #E2E8F0;">
                <div class="chart-title"><i class="fas fa-list"></i> ملخص المناوبات</div>
            </div>
            <div id="shiftsTableWrap">
                <div class="spinner-container"><div class="spinner"></div><span>جاري التحميل...</span></div>
            </div>
        </div>
    </div>

    <script src="/js/shift-dashboard.js"></script>
    <script src="/js/shift-charts.js"></script>
    <script src="/js/shift-export.js"></script>
    <script>
    (function() {
        'use strict';
        var currentWeekStart = DashUtils.getWeekStart();
        var currentData = null;
        DashUtils.initLiveClock('liveClock');
        if (!DashUtils.checkAuth()) return;

        function updateWeekDisplay() {
            var end = DashUtils.getWeekEnd(currentWeekStart);
            document.getElementById('weekDisplay').textContent = DashUtils.formatDate(currentWeekStart) + ' - ' + DashUtils.formatDate(end);
            document.getElementById('weekInput').value = currentWeekStart;
        }

        function changeWeek(days) {
            currentWeekStart = DashUtils.addDays(currentWeekStart, days);
            updateWeekDisplay();
            loadWeekly();
        }

        function setWeekFromInput() {
            var val = document.getElementById('weekInput').value;
            if (val) {
                currentWeekStart = DashUtils.getWeekStart(val);
                updateWeekDisplay();
                loadWeekly();
            }
        }

        function loadWeekly() {
            var weekEnd = DashUtils.getWeekEnd(currentWeekStart);
            DashUtils.showSpinner(document.getElementById('kpiGrid'));
            var cacheKey = 'weekly_' + currentWeekStart;
            var cached = DashUtils.cacheGet(cacheKey);
            if (cached) { renderWeekly(cached); return; }

            DashUtils.apiFetch('/api/shifts/weekly-dashboard?week_start=' + encodeURIComponent(currentWeekStart) + '&week_end=' + encodeURIComponent(weekEnd))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data && data.success) {
                        DashUtils.cacheSet(cacheKey, data, 300);
                        renderWeekly(data);
                    } else { DashUtils.showToast(data.error || 'فشل في تحميل البيانات', 'error'); }
                }).catch(function() { DashUtils.showToast('فشل في تحميل البيانات الأسبوعية', 'error'); });
        }

        function renderWeekly(data) {
            currentData = data;
            var kpi = document.getElementById('kpiGrid');
            kpi.innerHTML = '';
            DashUtils.renderKpiCard(kpi, 'fa-clipboard-list', DashUtils.formatNumber(data.total_reports || 0), 'إجمالي البلاغات', 'blue');
            DashUtils.renderKpiCard(kpi, 'fa-chart-line', DashUtils.formatNumber(data.avg_daily_reports || 0), 'متوسط يومي', 'purple');
            DashUtils.renderKpiCard(kpi, 'fa-arrow-up', data.peak_day || '-', 'أعلى يوم', 'green', null, data.peak_day_count || 0);
            DashUtils.renderKpiCard(kpi, 'fa-arrow-down', data.lowest_day || '-', 'أقل يوم', 'coral', null, data.lowest_day_count || 0);
            DashUtils.renderKpiCard(kpi, 'fa-percentage', DashUtils.formatPercent(data.completion_rate), 'نسبة الإنجاز', 'green');
            DashUtils.renderKpiCard(kpi, 'fa-clock', DashUtils.formatNumber(data.total_operating_hours || 0), 'ساعات التشغيل', 'gold');
            DashUtils.renderKpiCard(kpi, 'fa-users', DashUtils.formatNumber(data.total_staff || 0), 'الموظفين', 'blue');
            DashUtils.renderKpiCard(kpi, 'fa-people-group', DashUtils.formatNumber(data.total_teams || 0), 'الفرق', 'purple');
            DashUtils.renderKpiCard(kpi, 'fa-truck-medical', DashUtils.formatNumber(data.total_vehicles || 0), 'المركبات', 'blue');
            DashUtils.renderKpiCard(kpi, 'fa-user-group', DashUtils.formatNumber(data.avg_staff_per_shift || 0), 'متوسط الموظفين/مناوبة', 'purple');
            var change = data.comparison_last_week || 0;
            DashUtils.renderKpiCard(kpi, 'fa-chart-pie', DashUtils.formatPercent(change), 'مقارنة الأسبوع الماضي', change >= 0 ? 'green' : 'coral');

            renderDailyChart(data);
            renderTrendChart(data);
            renderShiftsTable(data.shifts || []);
        }

        function renderDailyChart(data) {
            var labels = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
            var values = [0,0,0,0,0,0,0];
            if (data.reports_by_day) {
                Object.keys(data.reports_by_day).forEach(function(d) {
                    var idx = parseInt(d, 10);
                    if (idx >= 0 && idx <= 6) values[idx] = data.reports_by_day[d];
                });
            }
            ChartHelpers.createBarChart('dailyChart', labels, [ChartHelpers.makeDataset('البلاغات', values, ChartHelpers.colors.primary)]);
        }

        function renderTrendChart(data) {
            var labels = labels || [];
            var values = [];
            if (data.completion_trend) {
                Object.keys(data.completion_trend).sort().forEach(function(k) {
                    labels.push(DashUtils.formatDate(k));
                    values.push(data.completion_trend[k]);
                });
            } else {
                labels = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
                values = [0,0,0,0,0,0,0];
            }
            ChartHelpers.createLineChart('trendChart', labels, [ChartHelpers.makeDataset('نسبة الإنجاز', values, ChartHelpers.colors.success, 'line')]);
        }

        function renderShiftsTable(shifts) {
            var wrap = document.getElementById('shiftsTableWrap');
            if (!shifts.length) { DashUtils.showEmpty(wrap, 'لا توجد مناوبات هذا الأسبوع'); return; }
            var html = '<div class="dashboard-table-wrap"><table class="dashboard-table"><thead><tr>' +
                '<th>التاريخ</th><th>النوع</th><th>المشرف</th><th>البلاغات</th><th>المنجزة</th><th>نسبة الإنجاز</th><th>إجراءات</th>' +
                '</tr></thead><tbody>';
            shifts.forEach(function(s) {
                var rate = s.completion_rate || 0;
                var badge = rate >= 80 ? 'badge-success' : rate >= 50 ? 'badge-warning' : 'badge-danger';
                html += '<tr>' +
                    '<td>' + DashUtils.formatDate(s.date) + '</td>' +
                    '<td>' + (s.shift_type || '-') + '</td>' +
                    '<td>' + (s.supervisor || '-') + '</td>' +
                    '<td>' + DashUtils.formatNumber(s.total_reports || 0) + '</td>' +
                    '<td>' + DashUtils.formatNumber(s.completed_reports || 0) + '</td>' +
                    '<td><span class="dashboard-badge ' + badge + '">' + DashUtils.formatPercent(rate) + '</span></td>' +
                    '<td><a class="dashboard-btn dashboard-btn-primary" style="padding:4px 10px; font-size:0.8rem;" href="/shift-detail.html?id=' + s.id + '">عرض</a></td>' +
                    '</tr>';
            });
            html += '</tbody></table></div>';
            wrap.innerHTML = html;
        }

        function exportWeeklyPDF() { ExportUtils.exportDashboardToPDF('weeklyDashboard', 'weekly_dashboard_' + currentWeekStart); }
        function exportWeeklyExcel() { if (!currentData || !currentData.shifts) return; ExportUtils.exportShiftsToExcel(currentData.shifts); }

        window.loadWeekly = loadWeekly;
        window.changeWeek = changeWeek;
        window.setWeekFromInput = setWeekFromInput;
        window.exportWeeklyPDF = exportWeeklyPDF;
        window.exportWeeklyExcel = exportWeeklyExcel;

        updateWeekDisplay();
        loadWeekly();
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>منصة الجنوب - إدارة العمليات الإسعافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #F0F4F8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== البطاقة الرئيسية ===== */
        .hero-card {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #0B1E33 0%, #1A3A5C 50%, #0D2A4A 100%);
            border-radius: 32px;
            padding: 40px 35px 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(11, 30, 51, 0.3);
        }

        /* خلفية معقدة */
        .hero-card::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(46, 139, 122, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-card::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(232, 200, 74, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== المحتوى ===== */
        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ===== المنطقة البصرية (تحل محل الأيقونة) ===== */
        .visual-area {
            width: 100%;
            max-width: 280px;
            height: 140px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* خطوط المظلة - تعكس ملامح المحطة */
        .visual-area .canopy {
            position: absolute;
            width: 85%;
            height: 35%;
            top: 18%;
            left: 7.5%;
            border-radius: 4px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
        }

        .visual-area .canopy-line {
            position: absolute;
            width: 70%;
            height: 1px;
            background: rgba(255,255,255,0.08);
            top: 50%;
            left: 15%;
            transform: translateY(-50%);
        }

        .visual-area .canopy-line:nth-child(2) {
            top: 65%;
            width: 60%;
            left: 20%;
        }

        .visual-area .canopy-line:nth-child(3) {
            top: 78%;
            width: 50%;
            left: 25%;
        }

        /* المثلثات الذهبية - رمز الفتحات المعمارية */
        .visual-area .triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            opacity: 0.6;
            bottom: 12%;
        }

        .visual-area .triangle-1 {
            left: 18%;
            border-width: 0 14px 30px 14px;
            border-color: transparent transparent #E8C84A transparent;
        }

        .visual-area .triangle-2 {
            left: 42%;
            border-width: 0 16px 34px 16px;
            border-color: transparent transparent #E8C84A transparent;
            opacity: 0.75;
        }

        .visual-area .triangle-3 {
            left: 66%;
            border-width: 0 14px 30px 14px;
            border-color: transparent transparent #E8C84A transparent;
        }

        /* نقطة ضوئية - إضاءة خلفية */
        .visual-area .glow {
            position: absolute;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(232, 200, 74, 0.10) 0%, transparent 70%);
            top: 20%;
            left: 20%;
            border-radius: 50%;
            filter: blur(20px);
        }

        /* خطوط عمودية رفيعة - إحساس معماري */
        .visual-area .v-line {
            position: absolute;
            width: 1px;
            height: 30%;
            background: rgba(255,255,255,0.04);
            bottom: 12%;
        }

        .visual-area .v-line-1 { left: 28%; }
        .visual-area .v-line-2 { left: 50%; }
        .visual-area .v-line-3 { left: 72%; }

        /* ===== النصوص ===== */
        .hero-title {
            color: #FFFFFF;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 6px;
        }

        .hero-title .gold {
            color: #E8C84A;
        }

        .hero-sub {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .hero-sub i {
            color: #E8C84A;
            margin: 0 6px;
            font-size: 0.3rem;
            vertical-align: middle;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 4px 18px;
            border-radius: 40px;
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* ===== أزرار وهمية (للحفاظ على التصميم) ===== */
        .mock-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }

        .mock-btn {
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
            cursor: default;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        .mock-btn.primary {
            background: #2A5A7A;
            color: #FFFFFF;
        }

        /* ===== التوافق مع الجوال ===== */
        @media (max-width: 500px) {
            .hero-card { padding: 25px 20px; }
            .hero-title { font-size: 1.6rem; }
            .visual-area { max-width: 200px; height: 110px; }
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <div class="hero-content">

            <!-- ===== المنطقة البصرية ===== -->
            <div class="visual-area">
                <div class="glow"></div>
                <div class="canopy">
                    <div class="canopy-line"></div>
                    <div class="canopy-line"></div>
                    <div class="canopy-line"></div>
                </div>
                <div class="triangle triangle-1"></div>
                <div class="triangle triangle-2"></div>
                <div class="triangle triangle-3"></div>
                <div class="v-line v-line-1"></div>
                <div class="v-line v-line-2"></div>
                <div class="v-line v-line-3"></div>
            </div>

            <!-- ===== النصوص ===== -->
            <h1 class="hero-title">منصة <span class="gold">الجنوب</span></h1>
            <div class="hero-sub">
                <i class="fas fa-circle"></i> إدارة العمليات الإسعافية
                <i class="fas fa-circle"></i> قطاع جنوب الرياض
            </div>
            <div class="hero-badge">محطة قصر الحكم</div>

            <!-- ===== أزرار وهمية ===== -->
            <div class="mock-buttons">
                <span class="mock-btn primary">🔄 مناوبة جديدة</span>
                <span class="mock-btn">📋 نموذج</span>
                <span class="mock-btn">📁 المستندات</span>
            </div>

        </div>
    </div>

    <!-- أيقونات Font Awesome للتوضيح -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="description" content="إدارة رموز المناوبات — منصة إدارة العمليات الإسعافية">
    <title>إدارة رموز المناوبات | منصة الجنوب</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#1E3A5F">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="css/app.css?v=10">
    <style>
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-bar h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-bar h1 i {
            color: var(--primary-700);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-700);
            font-family: var(--font-main);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--gray-50);
            border-color: var(--primary-700);
            color: var(--primary-700);
        }

        .btn-primary {
            background: var(--primary-700);
            border-color: var(--primary-700);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-800);
            border-color: var(--primary-800);
            color: #fff;
        }

        .info-banner {
            background: var(--info-50);
            border: 1px solid var(--info-light);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary-800);
        }

        .info-banner i {
            font-size: 1.2rem;
            color: var(--primary-700);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            border-right: 4px solid var(--primary-700);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .codes-table-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .codes-table-container .section-title {
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray-900);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .codes-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .codes-table thead {
            background: var(--gray-100);
        }

        .codes-table th {
            padding: 12px 16px;
            text-align: right;
            font-weight: 600;
            color: var(--gray-600);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--gray-200);
        }

        .codes-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-800);
            vertical-align: middle;
        }

        .codes-table tbody tr:hover {
            background: var(--gray-50);
        }

        .codes-table tbody tr:last-child td {
            border-bottom: none;
        }

        .code-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            min-width: 48px;
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-دوام   { background: var(--info-50); color: var(--primary-700); }
        .status-دوام::before   { background: var(--primary-700); }

        .status-تكميل   { background: var(--gold-50); color: var(--gold); }
        .status-تكميل::before   { background: var(--gold); }

        .status-تدريب   { background: #F3E8FF; color: #9333EA; }
        .status-تدريب::before   { background: #9333EA; }

        .status-إجازة   { background: var(--coral-50); color: var(--coral); }
        .status-إجازة::before   { background: var(--coral); }

        .status-راحة   { background: var(--teal-50); color: var(--teal); }
        .status-راحة::before   { background: var(--teal); }

        .time-range {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--gray-600);
            direction: ltr;
            display: inline-block;
        }

        .time-null {
            color: var(--gray-400);
            font-style: italic;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid var(--gray-200);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray-400);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: var(--coral);
            background: var(--coral-50);
            border-radius: var(--radius-lg);
        }

        .filter-bar {
            padding: 12px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--gray-200);
            background: var(--white);
            color: var(--gray-600);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary-700);
            border-color: var(--primary-700);
            color: #fff;
        }

        @media (max-width: 768px) {
            .page-container { padding: 16px; }
            .codes-table th, .codes-table td { padding: 10px 12px; font-size: 0.8rem; }
            .header-bar h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <div class="header-bar">
            <h1><i class="fas fa-clock"></i> إدارة رموز المناوبات</h1>
            <div class="header-actions">
                <button class="btn" onclick="loadCodes()">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <a href="index.html?v=10" class="btn btn-primary">
                    <i class="fas fa-arrow-right"></i> العودة للرئيسية
                </a>
            </div>
        </div>

        <!-- Info Banner -->
        <div class="info-banner">
            <i class="fas fa-info-circle"></i>
            <div>
                <strong>وضع القراءة فقط</strong> — هذه الصفحة تعرض رموز المناوبات المعترف بها في النظام.
                للتعديل، يرجى التواصل مع المشرف أو تحديث الملف <code>public/js/shift-codes-config.js</code>.
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card" style="border-right-color: var(--primary-700);">
                <div class="stat-value" id="totalCodes">—</div>
                <div class="stat-label">إجمالي الرموز</div>
            </div>
            <div class="stat-card" style="border-right-color: var(--primary-700);">
                <div class="stat-value" id="workingCodes">—</div>
                <div class="stat-label">رموز الدوام</div>
            </div>
            <div class="stat-card" style="border-right-color: var(--coral);">
                <div class="stat-value" id="vacationCodes">—</div>
                <div class="stat-label">رموز الإجازة</div>
            </div>
            <div class="stat-card" style="border-right-color: var(--gold);">
                <div class="stat-value" id="completionCodes">—</div>
                <div class="stat-label">رموز التكميل</div>
            </div>
        </div>

        <!-- Table -->
        <div class="codes-table-container">
            <div class="section-title">
                <i class="fas fa-list"></i> قائمة رموز المناوبات
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all" onclick="filterCodes('all')">الكل</button>
                <button class="filter-btn" data-filter="دوام" onclick="filterCodes('دوام')">دوام</button>
                <button class="filter-btn" data-filter="تكميل" onclick="filterCodes('تكميل')">تكميل</button>
                <button class="filter-btn" data-filter="تدريب" onclick="filterCodes('تدريب')">تدريب</button>
                <button class="filter-btn" data-filter="إجازة" onclick="filterCodes('إجازة')">إجازة</button>
                <button class="filter-btn" data-filter="راحة" onclick="filterCodes('راحة')">راحة</button>
            </div>
            <div id="tableContent">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الرموز...</div>
            </div>
        </div>
    </div>

    <!-- Load shift codes config -->
    <script type="module">
        import { SHIFT_CODES, getCodesByStatus } from './js/shift-codes-config.js';

        let allCodes = [...SHIFT_CODES];
        let currentFilter = 'all';

        function renderStats() {
            const byStatus = getCodesByStatus();
            document.getElementById('totalCodes').textContent = allCodes.length;
            document.getElementById('workingCodes').textContent = (byStatus['دوام'] || []).length;
            document.getElementById('vacationCodes').textContent = (byStatus['إجازة'] || []).length;
            document.getElementById('completionCodes').textContent = (byStatus['تكميل'] || []).length;
        }

        function renderTable(codes) {
            const statusOrder = { 'دوام': 1, 'تكميل': 2, 'تدريب': 3, 'إجازة': 4, 'راحة': 5 };
            const sorted = [...codes].sort((a, b) => {
                const aOrder = statusOrder[a.status] || 99;
                const bOrder = statusOrder[b.status] || 99;
                if (aOrder !== bOrder) return aOrder - bOrder;
                return a.code.localeCompare(b.code);
            });

            let html = `
                <table class="codes-table">
                    <thead>
                        <tr>
                            <th>الرمز</th>
                            <th>الاسم</th>
                            <th>من</th>
                            <th>إلى</th>
                            <th>اللون</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const sc of sorted) {
                const timeStart = sc.time_start
                    ? `<span class="time-range">${sc.time_start}</span>`
                    : `<span class="time-null">—</span>`;
                const timeEnd = sc.time_end
                    ? `<span class="time-range">${sc.time_end}</span>`
                    : `<span class="time-null">—</span>`;
                const badgeStyle = `background-color: ${sc.color}20; color: ${sc.color}; border: 1px solid ${sc.color}40;`;

                html += `
                    <tr>
                        <td><span class="code-badge" style="${badgeStyle}">${sc.code}</span></td>
                        <td>${sc.name}</td>
                        <td>${timeStart}</td>
                        <td>${timeEnd}</td>
                        <td><span class="color-dot" style="background-color: ${sc.color};"></span></td>
                        <td><span class="status-badge status-${sc.status}">${sc.status}</span></td>
                    </tr>
                `;
            }

            html += '</tbody></table>';
            document.getElementById('tableContent').innerHTML = html;
        }

        function filterCodes(filter) {
            currentFilter = filter;
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            // Filter data
            const filtered = filter === 'all'
                ? allCodes
                : allCodes.filter(c => c.status === filter);
            renderTable(filtered);
        }

        function loadCodes() {
            document.getElementById('tableContent').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الرموز...</div>';
            // In read-only mode we just re-render from the config
            // Future: fetch from /api/shift-codes
            setTimeout(() => {
                renderStats();
                filterCodes(currentFilter);
            }, 200);
        }

        // Expose to window for onclick handlers
        window.filterCodes = filterCodes;
        window.loadCodes = loadCodes;

        // Initial load
        renderStats();
        filterCodes('all');
    </script>
</body>
</html>

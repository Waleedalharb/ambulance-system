<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف — منصة الجنوب</title>
    <link rel="stylesheet" href="css/app.css?v=34">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/a11y.css?v=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ═══ إعادة توكنة محلية — الهوية التنفيذية الداكنة الموحدة ═══
           تتفوق على app.css المشترك (وراثة لاحقة) دون تعديل الملف المشترك */
        :root {
            --white:   rgba(255,255,255,0.035);
            --gray-50: #0A1220;
            --gray-100:rgba(255,255,255,0.05);
            --gray-200:rgba(255,255,255,0.08);
            --gray-300:rgba(255,255,255,0.10);
            --gray-400:#7C8DA6;
            --gray-500:#A9BACD;
            --gray-600:#C2CFDD;
            --gray-700:#D5DEE9;
            --gray-800:#F1F5F9;
            --gray-900:#F1F5F9;
            --primary: #60A5FA;
            --primary-700: #3B82F6;
            --teal: #10B586;
            --gold: #FBBF24;
            --coral: #F87171;
            --shadow: inset 0 1px 0 rgba(255,255,255,0.045), 0 10px 30px rgba(0,0,0,0.30);
            --shadow-exec: inset 0 1px 0 rgba(255,255,255,0.045), 0 10px 30px rgba(0,0,0,0.30);
        }

        /* طبقة الهوية: تدرجات + شبكة مقنّعة + توهج سفلي */
        body {
            background:
                radial-gradient(1100px 620px at 85% -10%, rgba(14,164,122,0.10), transparent 60%),
                radial-gradient(900px 540px at 8% -5%, rgba(96,165,250,0.08), transparent 55%),
                #0A1220 !important;
            background-attachment: fixed !important;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 78%);
                    mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 78%);
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(1200px 500px at 50% 110%, rgba(14,164,122,0.05), transparent 65%);
        }
        :focus-visible {
            outline: 2px solid rgba(14,164,122,0.50) !important;
            outline-offset: 2px;
        }
        ::selection {
            background: rgba(14,164,122,0.28);
            color: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10) !important; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18) !important; }

        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); border-right: 4px solid var(--primary); }
        .stat-card h3 { font-size: 0.85rem; color: var(--gray-500); margin: 0 0 8px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--gray-900); }
        .stat-change { font-size: 0.75rem; color: var(--teal); margin-top: 4px; }
        .chart-container { background: var(--white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); margin-bottom: 24px; }
        .chart-container h3 { margin: 0 0 16px; font-size: 1rem; color: var(--gray-900); }
        .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .top-list { background: var(--white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
        .top-list h3 { margin: 0 0 16px; font-size: 1rem; }
        .top-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--gray-200); }
        .top-item:last-child { border-bottom: none; }
        .top-bar { height: 6px; background: var(--gray-200); border-radius: 3px; margin-top: 4px; }
        .top-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; }
        .audit-log { background: var(--white); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); max-height: 400px; overflow-y: auto; }
        .audit-log h3 { margin: 0 0 12px; font-size: 1rem; color: var(--gray-900); text-align: right; }
        .audit-item { padding: 12px 0; padding-right: 12px; border-right: 3px solid transparent; border-bottom: 1px solid var(--gray-200); font-size: 0.85rem; text-align: right; transition: background 0.15s, border-color 0.15s; }
        .audit-item:last-child { border-bottom: none; }
        .audit-item:hover { background: var(--gray-50); border-right-color: var(--primary); }
        .audit-time { color: var(--gray-400); font-size: 0.75rem; margin-top: 6px; text-align: right; display: block; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header-bar h1 { font-size: 1.4rem; margin: 0; }
        .btn-refresh { background: #0EA47A; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .btn-refresh:hover { background: #0B8C66; }
        .loading { text-align: center; padding: 40px; color: var(--gray-400); }
        .error { text-align: center; padding: 40px; color: var(--coral); }
        @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
        /* System Monitor Styles */
        .monitor-section { margin-top: 24px; }
        .monitor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .monitor-header h2 { font-size: 1.1rem; margin: 0; color: var(--gray-900); }
        .monitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .monitor-card { background: var(--white); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); border-right: 3px solid var(--gray-300); }
        .monitor-card.ok { border-color: var(--teal); }
        .monitor-card.warning { border-color: var(--gold); }
        .monitor-card.critical { border-color: var(--coral); }
        .monitor-card h4 { font-size: 0.8rem; color: var(--gray-500); margin: 0 0 6px; }
        .monitor-value { font-size: 1.4rem; font-weight: 700; color: var(--gray-900); }
        .monitor-detail { font-size: 0.75rem; color: var(--gray-400); margin-top: 4px; }
        .alert-item { padding: 10px; border-radius: 8px; margin-bottom: 8px; background: rgba(245,158,11,0.10); border-right: 3px solid var(--gold); }
        .alert-item.critical { background: rgba(239,68,68,0.12); border-color: var(--coral); }
        .alert-item.warning { background: rgba(245,158,11,0.12); border-color: var(--gold); }
        .alert-item .alert-msg { font-size: 0.85rem; color: var(--gray-800); }
        .alert-item .alert-meta { font-size: 0.7rem; color: var(--gray-400); margin-top: 4px; }
        .btn-resolve { background: var(--teal); color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 6px; }
        .btn-resolve:hover { background: #0B8C66; }
        .log-item { padding: 6px 0; border-bottom: 1px solid var(--gray-100); font-size: 0.8rem; }
        .log-item:last-child { border-bottom: none; }
        .log-level { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-left: 6px; }
        .log-level.info { background: rgba(56,189,248,0.14); color: #7DD3FC; }
        .log-level.warning { background: rgba(245,158,11,0.14); color: #FCD34D; }
        .log-level.error { background: rgba(239,68,68,0.14); color: #FCA5A5; }
        .log-level.critical { background: rgba(239,68,68,0.24); color: #FECACA; }
        .log-level.heal { background: rgba(16,185,129,0.14); color: #6EE7B7; }
        .btn-force-check { background: #0EA47A; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        .btn-force-check:hover { background: #0B8C66; }
        .monitor-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 768px) { .monitor-panels { grid-template-columns: 1fr; } }
        /* Admin Tools */
        .admin-tools { background: var(--white); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); margin-top: 16px; }
        .admin-tools h3 { margin: 0 0 16px; font-size: 1rem; color: var(--gray-900); }
        .btn-danger { background: var(--coral); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-danger:hover { background: #dc2626; }
        .btn-danger:disabled { opacity: 0.6; cursor: not-allowed; }
        .clear-result { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.85rem; display: none; }
        .clear-result.success { background: rgba(16,185,129,0.14); color: #6EE7B7; display: block; }
        .clear-result.error { background: rgba(239,68,68,0.14); color: #FCA5A5; display: block; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-bar">
            <h1><i class="fas fa-chart-line"></i> لوحة تحكم المشرف</h1>
            <button class="btn-refresh" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> تحديث</button>
        </div>

        <div id="loading" class="loading">جاري تحميل البيانات...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="dashboard" style="display:none;">
            <!-- Stats Cards -->
            <div class="stats-grid" id="statsGrid"></div>

            <!-- Charts -->
            <div class="two-col">
                <div class="chart-container">
                    <h3><i class="fas fa-chart-bar"></i> البلاغات حسب الساعة</h3>
                    <canvas id="hourlyChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3><i class="fas fa-chart-line"></i> آخر 7 أيام</h3>
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>

            <!-- Top Centers & Audit Log -->
            <div class="two-col">
                <div class="top-list">
                    <h3><i class="fas fa-trophy"></i> المراكز الأكثر نشاطاً</h3>
                    <div id="topCenters"></div>
                </div>
                <div class="audit-log">
                    <h3><i class="fas fa-history"></i> آخر الأنشطة</h3>
                    <div id="auditLog"></div>
                </div>
            </div>

            <!-- System Monitor -->
            <div class="monitor-section">
                <div class="monitor-header">
                    <h2><i class="fas fa-heartbeat"></i> مراقبة النظام (AI Monitor)</h2>
                    <div>
                        <button class="btn-force-check" onclick="forceHealthCheck()"><i class="fas fa-stethoscope"></i> فحص الآن</button>
                        <button class="btn-force-check" onclick="runAutoFix()" style="margin-right:8px;background:var(--teal);"><i class="fas fa-magic"></i> تشغيل الإصلاح</button>
                        <button class="btn-refresh" onclick="loadMonitor()" style="margin-right:8px;"><i class="fas fa-sync-alt"></i> تحديث</button>
                    </div>
                </div>
                <div class="monitor-grid" id="monitorHealthGrid"></div>
                <div class="monitor-panels">
                    <div class="chart-container">
                        <h3><i class="fas fa-bell"></i> التنبيهات النشطة <span id="alertCount" style="font-size:0.8rem;color:var(--gray-400)"></span></h3>
                        <div id="monitorAlerts" style="max-height:300px;overflow-y:auto;"></div>
                    </div>
                    <div class="chart-container">
                        <h3><i class="fas fa-file-alt"></i> آخر السجلات</h3>
                        <div id="monitorLogs" style="max-height:300px;overflow-y:auto;"></div>
                    </div>
                </div>

                <!-- Frontend Errors & Auto-Fix -->
                <div class="monitor-panels" style="margin-top:16px;">
                    <div class="chart-container">
                        <h3><i class="fas fa-bug"></i> أخطاء المتصفح <span id="frontendErrorCount" style="font-size:0.8rem;color:var(--gray-400)"></span></h3>
                        <div id="frontendErrors" style="max-height:300px;overflow-y:auto;"></div>
                    </div>
                    <div class="chart-container">
                        <h3><i class="fas fa-magic"></i> الإصلاحات التلقائية</h3>
                        <div id="autoFixStats" style="max-height:300px;overflow-y:auto;"></div>
                    </div>
                </div>
            </div>
            <!-- Admin Tools -->
            <div class="admin-tools">
                <h3><i class="fas fa-tools"></i> أدوات المشرف</h3>
                <a href="admin-vehicles.html" class="btn-force-check" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-left:8px;" title="السجل المرجعي للأسطول + تاريخ كل مركبة"><i class="fas fa-ambulance"></i> إدارة المركبات</a>
                <a href="admin-symbols.html" class="btn-force-check" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-left:8px;background:linear-gradient(135deg,#2E8B7A,#1F6B5C);" title="السجل المركزي لرموز الجداول — أكواد الأيام ورموز الموظفين والأكواد التشغيلية"><i class="fas fa-cogs"></i> ⚙️ إدارة رموز الجداول</a>
                <button id="clearAllBtn" class="btn-danger" onclick="clearAllScheduleData()">
                    <i class="fas fa-trash-alt"></i> مسح كل بيانات الجداول (IndexedDB + Server)
                </button>
                <div id="clearResult" class="clear-result"></div>
            </div>
        </div>
    </div>

    <script src="js/core/core-auth.js"></script>
    <script src="js/core/core-toast.js"></script>
    <script src="/js/time-riyadh.js"></script>
    <script src="js/core/core-time.js"></script>
    <script>
        var authToken = AuthCore.getToken();
        var hourlyChart, weeklyChart;

        async function loadDashboard() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';

            if (!authToken) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = '❌ يجب تسجيل الدخول أولاً<br><a href="index.html?v=34" style="color:var(--primary);text-decoration:underline;">العودة للصفحة الرئيسية</a>';
                return;
            }

            try {
                var res = await fetch('/api/admin/stats', { headers: { 'Authorization': 'Bearer ' + authToken } });
                if (res.status === 401 || res.status === 403) {
                    throw new Error('يجب تسجيل الدخول كمشرف للوصول للوحة التحكم');
                }
                var result = await res.json();
                if (!result.success) throw new Error(result.error || 'فشل في تحميل البيانات');

                renderStats(result.stats);
                renderCharts(result.stats);
                renderTopCenters(result.stats.centerStats);

                // Load audit log
                var auditRes = await fetch('/api/audit-log', { headers: { 'Authorization': 'Bearer ' + authToken } });
                var auditResult = await auditRes.json();
                if (auditResult.success) renderAuditLog(auditResult.logs || []);

                // Load AI Monitor data
                loadMonitor();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = '❌ ' + e.message + '<br><a href="index.html?v=34" style="color:var(--primary);text-decoration:underline;">العودة للصفحة الرئيسية</a>';
            }
        }

        function renderStats(stats) {
            var grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card" style="border-color:var(--primary)">
                    <h3>إجمالي البلاغات</h3>
                    <div class="stat-value">${stats.totalReports}</div>
                    <div class="stat-change">📊 البلاغات المسجلة</div>
                </div>
                <div class="stat-card" style="border-color:var(--teal)">
                    <h3>المراكز النشطة</h3>
                    <div class="stat-value">${stats.activeCenters}</div>
                    <div class="stat-change">🏥 مراكز ببلاغات</div>
                </div>
                <div class="stat-card" style="border-color:var(--gold)">
                    <h3>المناوبات</h3>
                    <div class="stat-value">${stats.totalShifts}</div>
                    <div class="stat-change">📋 في الأرشيف</div>
                </div>
                <div class="stat-card" style="border-color:var(--coral)">
                    <h3>المستخدمين</h3>
                    <div class="stat-value">${stats.totalUsers}</div>
                    <div class="stat-change">👥 نشطين</div>
                </div>
            `;
        }

        function renderCharts(stats) {
            // Hourly chart
            var hourlyCtx = document.getElementById('hourlyChart').getContext('2d');
            if (hourlyChart) hourlyChart.destroy();
            hourlyChart = new Chart(hourlyCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(stats.hourlyDistribution).map(h => h + ':00'),
                    datasets: [{
                        label: 'البلاغات',
                        data: Object.values(stats.hourlyDistribution),
                        backgroundColor: 'rgba(59, 130, 246, 0.7)',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });

            // Weekly chart
            var weeklyCtx = document.getElementById('weeklyChart').getContext('2d');
            if (weeklyChart) weeklyChart.destroy();
            weeklyChart = new Chart(weeklyCtx, {
                type: 'line',
                data: {
                    labels: stats.last7Days.map(d => d.date),
                    datasets: [{
                        label: 'البلاغات',
                        data: stats.last7Days.map(d => d.reports),
                        borderColor: 'var(--primary)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function renderTopCenters(centerStats) {
            var container = document.getElementById('topCenters');
            var sorted = Object.entries(centerStats).sort((a, b) => b[1] - a[1]).slice(0, 10);
            var max = sorted[0] ? sorted[0][1] : 1;
            container.innerHTML = sorted.map(([center, count]) => `
                <div class="top-item">
                    <span>${center}</span>
                    <span><strong>${count}</strong> بلاغ</span>
                </div>
                <div class="top-bar">
                    <div class="top-bar-fill" style="width: ${(count / max) * 100}%"></div>
                </div>
            `).join('');
        }

        function renderAuditLog(logs) {
            var container = document.getElementById('auditLog');
            if (!logs || logs.length === 0) {
                container.innerHTML = '<p style="color:var(--gray-400)">لا توجد أنشطة حديثة</p>';
                return;
            }
            container.innerHTML = logs.slice(0, 15).map(entry => `
                <div class="audit-item">
                    <div><strong>${entry.action}</strong> — ${entry.user}</div>
                    <div class="audit-time">${TimeRiyadh.formatDateTimeSec(entry.timestamp)}</div>
                </div>
            `).join('');
        }

        // ─── AI Monitor Functions ───
        async function loadMonitor() {
            try {
                var [healthRes, statsRes, alertsRes, logsRes] = await Promise.all([
                    fetch('/api/admin/monitor/health', { headers: { 'Authorization': 'Bearer ' + authToken } }),
                    fetch('/api/admin/monitor/stats', { headers: { 'Authorization': 'Bearer ' + authToken } }),
                    fetch('/api/admin/monitor/alerts', { headers: { 'Authorization': 'Bearer ' + authToken } }),
                    fetch('/api/admin/monitor/logs?limit=30', { headers: { 'Authorization': 'Bearer ' + authToken } })
                ]);

                var health = healthRes.ok ? (await healthRes.json()).health : null;
                var stats = statsRes.ok ? (await statsRes.json()).stats : null;
                var alerts = alertsRes.ok ? (await alertsRes.json()).alerts : [];
                var logs = logsRes.ok ? (await logsRes.json()).logs : [];

                renderMonitorHealth(health, stats);
                renderMonitorAlerts(alerts);
                renderMonitorLogs(logs);
                renderAutoFixStats(stats);
                loadFrontendErrors();
            } catch (e) {
                console.error('Monitor load error:', e);
            }
        }

        async function runAutoFix() {
            try {
                var res = await fetch('/api/admin/auto-fix', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                var result = await res.json();
                if (result.success) {
                    alert('✅ تم الإصلاح التلقائي: ' + result.totalFixed + ' إصلاح');
                    loadMonitor();
                } else {
                    alert('❌ ' + (result.error || 'فشل في الإصلاح'));
                }
            } catch (e) {
                alert('فشل في الاتصال');
            }
        }

        function renderMonitorHealth(health, stats) {
            var grid = document.getElementById('monitorHealthGrid');
            if (!health) {
                grid.innerHTML = '<p style="color:var(--gray-400)">غير متوفر</p>';
                return;
            }
            var dbOk = health.dbPing && health.dbPing.ok;
            var dbMs = health.dbPing ? health.dbPing.ms : 0;
            var heapMB = Math.round(health.memory.heapUsed / 1024 / 1024);
            var heapLimitMB = Math.round(health.memory.heapLimit / 1024 / 1024);
            var leak = health.memoryLeak && health.memoryLeak.leakDetected;
            var wsCount = health.wsConnections || 0;
            var uptime = health.uptimeSec || 0;
            var errRate = health.errorRatePerMinute || 0;

            var dbClass = dbOk ? 'ok' : 'critical';
            var memClass = heapMB > 400 ? (heapMB > 500 ? 'critical' : 'warning') : 'ok';
            var leakClass = leak ? 'critical' : 'ok';
            var errClass = errRate > 5 ? 'critical' : (errRate >= 3 ? 'warning' : 'ok');

            grid.innerHTML = `
                <div class="monitor-card ${dbClass}">
                    <h4><i class="fas fa-database"></i> قاعدة البيانات</h4>
                    <div class="monitor-value">${dbOk ? '✅ متصلة' : '❌ غير متصلة'}</div>
                    <div class="monitor-detail">${dbMs} ملي ثانية | ${health.checkTime ? TimeRiyadh.formatTimeSec(health.checkTime) : ''}</div>
                </div>
                <div class="monitor-card ${memClass}">
                    <h4><i class="fas fa-memory"></i> الذاكرة (Heap)</h4>
                    <div class="monitor-value">${heapMB} / ${heapLimitMB} MB</div>
                    <div class="monitor-detail">RSS: ${Math.round(health.memory.rss / 1024 / 1024)} MB</div>
                </div>
                <div class="monitor-card ${leakClass}">
                    <h4><i class="fas fa-vial"></i> تسرب الذاكرة</h4>
                    <div class="monitor-value">${leak ? '⚠️ مكتشف' : '✅ لا يوجد'}</div>
                    <div class="monitor-detail">${health.memoryLeak ? 'نمو: ' + (health.memoryLeak.growthRate * 100).toFixed(1) + '%' : ''}</div>
                </div>
                <div class="monitor-card ${errRate > 0 ? 'warning' : 'ok'}">
                    <h4><i class="fas fa-bolt"></i> WebSocket</h4>
                    <div class="monitor-value">${wsCount} متصل</div>
                    <div class="monitor-detail">اتصالات فعالة</div>
                </div>
                <div class="monitor-card ${errClass}">
                    <h4><i class="fas fa-exclamation-triangle"></i> أخطاء API</h4>
                    <div class="monitor-value">${errRate}/دقيقة</div>
                    <div class="monitor-detail">500 errors في آخر دقيقة</div>
                </div>
                <div class="monitor-card ok">
                    <h4><i class="fas fa-clock"></i> وقت التشغيل</h4>
                    <div class="monitor-value">${Math.floor(uptime / 60)} دقيقة</div>
                    <div class="monitor-detail">منذ آخر إعادة تشغيل</div>
                </div>
            `;
            if (stats) {
                grid.innerHTML += `
                    <div class="monitor-card ok">
                        <h4><i class="fas fa-stethoscope"></i> فحوصات</h4>
                        <div class="monitor-value">${stats.checksPerformed || 0}</div>
                        <div class="monitor-detail">إصلاحات تلقائية: ${stats.autoFixesApplied || 0}</div>
                    </div>
                    <div class="monitor-card ok">
                        <h4><i class="fas fa-bell"></i> التنبيهات</h4>
                        <div class="monitor-value">${stats.activeAlerts || 0} نشطة</div>
                        <div class="monitor-detail">إجمالي: ${stats.totalAlerts || 0} | محلولة: ${stats.alertsResolved || 0}</div>
                    </div>
                `;
            }
        }

        function renderMonitorAlerts(alerts) {
            var container = document.getElementById('monitorAlerts');
            document.getElementById('alertCount').textContent = alerts.length > 0 ? '(' + alerts.length + ')' : '';
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<p style="color:var(--gray-400);padding:10px;">لا توجد تنبيهات نشطة ✅</p>';
                return;
            }
            container.innerHTML = alerts.map(a => `
                <div class="alert-item ${a.level}">
                    <div class="alert-msg">[${a.level.toUpperCase()}] ${a.category} — ${a.message}</div>
                    <div class="alert-meta">#${a.id} | ${TimeRiyadh.formatDateTimeSec(a.createdAt)}</div>
                    ${a.requiresAttention ? '<span style="color:var(--coral);font-size:0.75rem;">⚠️ يتطلب اهتمام</span>' : ''}
                    <br>
                    <button class="btn-resolve" onclick="resolveAlert(${a.id})"><i class="fas fa-check"></i> حل التنبيه</button>
                </div>
            `).join('');
        }

        function renderMonitorLogs(logs) {
            var container = document.getElementById('monitorLogs');
            if (!logs || logs.length === 0) {
                container.innerHTML = '<p style="color:var(--gray-400);padding:10px;">لا توجد سجلات</p>';
                return;
            }
            container.innerHTML = logs.slice().reverse().map(l => `
                <div class="log-item">
                    <span class="log-level ${l.level}">${l.level}</span>
                    <strong>${l.category}</strong> — ${l.message}
                    <div style="color:var(--gray-400);font-size:0.7rem;margin-top:2px;">${TimeRiyadh.formatTimeSec(l.timestamp)}</div>
                </div>
            `).join('');
        }

        async function resolveAlert(id) {
            try {
                var res = await fetch('/api/admin/monitor/alerts/' + id + '/resolve', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                var result = await res.json();
                if (result.success) {
                    loadMonitor();
                } else {
                    alert(result.error || 'فشل في حل التنبيه');
                }
            } catch (e) {
                alert('فشل في الاتصال');
            }
        }

        async function forceHealthCheck() {
            try {
                var res = await fetch('/api/admin/monitor/force-check', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                var result = await res.json();
                if (result.success) {
                    loadMonitor();
                }
            } catch (e) {
                alert('فشل في تشغيل الفحص');
            }
        }

        // Load on page load
        loadDashboard();

        async function loadFrontendErrors() {
            try {
                var res = await fetch('/api/admin/frontend-errors?limit=20', { headers: { 'Authorization': 'Bearer ' + authToken } });
                var result = await res.json();
                var container = document.getElementById('frontendErrors');
                var countEl = document.getElementById('frontendErrorCount');
                if (!result.success || !result.errors || result.errors.length === 0) {
                    container.innerHTML = '<p style="color:var(--gray-400);padding:10px;">لا توجد أخطاء في المتصفح ✅</p>';
                    countEl.textContent = '';
                    return;
                }
                countEl.textContent = '(' + result.errors.length + '+)';
                container.innerHTML = result.errors.map(e => `
                    <div class="log-item">
                        <span class="log-level error">${e.type}</span>
                        <strong>${e.message ? e.message.substring(0, 80) : 'Error'}</strong>
                        <div style="color:var(--gray-400);font-size:0.7rem;margin-top:2px;">
                            ${e.page_path || ''} | ${TimeRiyadh.formatTimeSec(e.timestamp)}
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Frontend errors load error:', e);
            }
        }

        function renderAutoFixStats(stats) {
            var container = document.getElementById('autoFixStats');
            if (!stats) {
                container.innerHTML = '<p style="color:var(--gray-400);padding:10px;">غير متوفر</p>';
                return;
            }
            container.innerHTML = `
                <div class="log-item">
                    <span class="log-level heal">✅</span>
                    <strong>إصلاحات تلقائية</strong>: ${stats.autoFixesApplied || 0}
                </div>
                <div class="log-item">
                    <span class="log-level info">📊</span>
                    <strong>فحوصات</strong>: ${stats.checksPerformed || 0}
                </div>
                <div class="log-item">
                    <span class="log-level warning">⚠️</span>
                    <strong>تنبيهات نشطة</strong>: ${stats.activeAlerts || 0}
                </div>
                <div class="log-item">
                    <span class="log-level info">📝</span>
                    <strong>سجلات في الذاكرة</strong>: ${stats.logsInMemory || 0}
                </div>
                <div class="log-item">
                    <span class="log-level info">⏱️</span>
                    <strong>وقت التشغيل</strong>: ${Math.floor(stats.uptimeSec / 60)} دقيقة
                </div>
            `;
        }

        async function clearAllScheduleData() {
            var btn = document.getElementById('clearAllBtn');
            var resultDiv = document.getElementById('clearResult');
            if (!confirm('⚠️ تحذير: سيتم حذف ALL schedule data نهائياً!\n\nسيتم مسح:\n• بيانات IndexedDB (smart-schedule)\n• بيانات localStorage\n• بيانات السيرвер\n\nهل أنت متأكد؟')) return;
            btn.disabled = true;
            resultDiv.className = 'clear-result';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';
            var cleared = [];
            var errors = [];
            // 1. Clear IndexedDB
            try {
                var req = indexedDB.open('smartScheduleDB', 1);
                req.onsuccess = function(e) {
                    var db = e.target.result;
                    if (db.objectStoreNames.contains('employees')) {
                        var tx = db.transaction('employees', 'readwrite');
                        var store = tx.objectStore('employees');
                        store.clear();
                    }
                    db.close();
                };
                cleared.push('IndexedDB (smartScheduleDB)');
            } catch (e) { errors.push('IndexedDB: ' + e.message); }
            // 2. Clear localStorage keys
            var localKeys = ['ss_employees']; // F6: حُذفت المفاتيح الأربعة الميتة (صفر مراجع في public/)
            localKeys.forEach(function(key) {
                try { localStorage.removeItem(key); cleared.push('localStorage: ' + key); }
                catch (e) { errors.push('localStorage ' + key + ': ' + e.message); }
            });
            // 3. Clear server data
            try {
                var res = await fetch('/api/shift-roster/clear-all', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }
                });
                var result = await res.json();
                if (result.success) cleared.push('Server (SQLite shift_roster)');
                else errors.push('Server: ' + (result.error || 'unknown'));
            } catch (e) { errors.push('Server: ' + e.message); }
            // Show result
            if (errors.length === 0) {
                resultDiv.className = 'clear-result success';
                resultDiv.innerHTML = '✅ تم المسح بنجاح:<br>• ' + cleared.join('<br>• ');
            } else {
                resultDiv.className = 'clear-result error';
                resultDiv.innerHTML = '⚠️ تم المسح بجزئية:<br>• ' + cleared.join('<br>• ') + '<br><br>❌ أخطاء:<br>• ' + errors.join('<br>• ');
            }
            btn.disabled = false;
        }
    </script>

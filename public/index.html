<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>جدول توزيع البلاغات - قطاع جنوب الرياض</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', 'Segoe UI', 'Arial', monospace;
        }
        body {
            background: #ffffff;
            margin: 0;
            padding: 20px;
            color: #000000;
        }
        .container {
            max-width: 1400px;
            margin: auto;
        }
        /* رأس الصفحة - مثل الورقة المطبوعة */
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .header .sub1 {
            margin: 8px 0 0;
            font-size: 0.9rem;
            color: #333;
        }
        .header .sub2 {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: #333;
        }
        .header .date {
            margin: 12px 0 0;
            font-size: 0.8rem;
        }
        /* شريط المعلومات */
        .info-bar {
            border: 1px solid #000;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #f9f9f9;
        }
        .total-box {
            border: 1px solid #000;
            padding: 6px 18px;
            font-weight: bold;
            font-size: 1rem;
        }
        .total-box span {
            font-size: 1.6rem;
            margin-left: 8px;
            font-weight: bold;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: white;
            border: 1px solid #000;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: monospace;
            transition: 0.1s;
        }
        .toolbar button:active {
            background: #ddd;
        }
        /* بطاقات المراكز */
        .point-card {
            border: 1px solid #000;
            margin-bottom: 15px;
            background: white;
        }
        .point-title {
            margin: 0;
            padding: 8px 12px;
            font-size: 1rem;
            font-weight: bold;
            background: #f0f0f0;
            border-bottom: 1px solid #000;
        }
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0;
        }
        .unit-card {
            padding: 10px 6px;
            text-align: center;
            border-left: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            background: white;
        }
        .unit-card:nth-child(even) {
            background: #fafafa;
        }
        .unit-name {
            font-size: 0.9rem;
            font-weight: bold;
            padding: 4px;
            border-bottom: 1px dotted #aaa;
            margin-bottom: 6px;
            font-family: monospace;
        }
        .count-number {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 6px 0;
            font-family: monospace;
        }
        .report-btn {
            background: white;
            border: 1px solid #000;
            padding: 5px;
            width: 100%;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            margin: 4px 0;
            font-family: monospace;
        }
        .report-btn:active {
            background: #ddd;
        }
        .show-times-btn {
            background: white;
            border: 1px solid #888;
            padding: 4px;
            width: 100%;
            font-size: 0.65rem;
            cursor: pointer;
            margin: 2px 0;
            font-family: monospace;
        }
        /* نافذة التواقيت */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border: 2px solid #000;
            max-width: 380px;
            width: 85%;
            padding: 15px;
            text-align: center;
        }
        .modal-content h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            border-bottom: 1px solid #000;
            padding-bottom: 6px;
        }
        .modal-times {
            background: #f9f9f9;
            border: 1px solid #aaa;
            padding: 10px;
            max-height: 260px;
            overflow-y: auto;
            text-align: right;
            margin: 12px 0;
        }
        .modal-times p {
            margin: 5px 0;
            font-size: 0.75rem;
            font-family: monospace;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 3px;
        }
        .close-modal {
            background: white;
            border: 1px solid #000;
            padding: 6px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 12px;
            border-top: 1px solid #aaa;
            font-size: 0.65rem;
            color: #444;
        }
        @media (max-width: 650px) {
            body { padding: 10px; }
            .units-grid { grid-template-columns: 1fr; }
            .unit-card { border-left: none; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>قطاعات الرياض</h1>
        <div class="sub1">إدارة القطاعات بمنطقة الرياض - فريق الجودة والتطوير</div>
        <div class="sub2">جدول توزيع البلاغات على الوحدات الإسعافية</div>
        <div class="date">📅 التاريخ: <span id="currentDate"></span></div>
    </div>

    <div class="info-bar">
        <div class="total-box">📊 إجمالي البلاغات: <span id="grandTotal">0</span></div>
        <div class="toolbar">
            <button id="exportBtn">📎 تصدير Excel</button>
            <button id="resetBtn">🗑️ تصفير الكل</button>
        </div>
    </div>

    <div id="pointsContainer">
        <div class="loading">⏳ جاري تحميل البيانات...</div>
    </div>
    <footer>⏱️ ضغطة واحدة = تسجيل بلاغ مع الوقت الفعلي | جميع الأجهزة تشترك في نفس البيانات</footer>
</div>

<div id="timeModal" class="modal">
    <div class="modal-content">
        <h3 id="modalUnitName">الوحدة</h3>
        <div id="modalTimesList" class="modal-times"></div>
        <button class="close-modal" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    // ============================================
    // المتغيرات العامة
    // ============================================
    let centersData = {};
    let reports = {};

    // ============================================
    // دوال الاتصال بالخادم
    // ============================================
    async function loadAllData() {
        try {
            const response = await fetch('/api/data');
            const result = await response.json();
            centersData = result.centers;
            reports = result.data;
            renderData();
            updateTotal();
        } catch (error) {
            console.error("خطأ:", error);
            document.getElementById("pointsContainer").innerHTML = "<div class='loading'>❌ خطأ في الاتصال بالخادم</div>";
        }
    }

    async function addReportToServer(center, unit) {
        try {
            const response = await fetch('/api/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ center, unit })
            });
            const result = await response.json();
            if (result.success) {
                await loadAllData();
            }
        } catch (error) {
            console.error("خطأ:", error);
            alert("❌ فشل في تسجيل البلاغ");
        }
    }

    async function resetAll() {
        if (!confirm("⚠️ هل أنت متأكد من تصفير جميع البلاغات؟")) return;
        try {
            const response = await fetch('/api/reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const result = await response.json();
            if (result.success) {
                await loadAllData();
            }
        } catch (error) {
            console.error("خطأ:", error);
            alert("❌ فشل في تصفير البيانات");
        }
    }

    function exportExcel() {
        window.open('/api/export', '_blank');
    }

    // ============================================
    // دوال الواجهة
    // ============================================
    function updateTotal() {
        let total = 0;
        for (let key in reports) {
            total += reports[key].count;
        }
        document.getElementById("grandTotal").innerText = total;
    }

    function renderData() {
        const container = document.getElementById("pointsContainer");
        if (!centersData || Object.keys(centersData).length === 0) {
            container.innerHTML = "<div class='loading'>❌ لا توجد بيانات</div>";
            return;
        }
        
        container.innerHTML = "";
        
        for (let center in centersData) {
            const pointDiv = document.createElement("div");
            pointDiv.className = "point-card";
            pointDiv.innerHTML = `<div class="point-title">📋 ${center}</div><div class="units-grid" id="grid-${center.replace(/\s/g, '')}"></div>`;
            container.appendChild(pointDiv);
            
            const grid = pointDiv.querySelector(".units-grid");
            
            for (let unit of centersData[center]) {
                const key = `${center}|${unit}`;
                const info = reports[key] || { count: 0, times: [] };
                
                const unitDiv = document.createElement("div");
                unitDiv.className = "unit-card";
                unitDiv.innerHTML = `
                    <div class="unit-name">${unit}</div>
                    <div class="count-number">${info.count}</div>
                    <button class="report-btn">➕ تسجيل بلاغ</button>
                    <button class="show-times-btn">📋 عرض التواقيت</button>
                `;
                
                unitDiv.querySelector(".report-btn").onclick = (() => addReportToServer(center, unit));
                unitDiv.querySelector(".show-times-btn").onclick = (() => showTimes(center, unit, info.times));
                grid.appendChild(unitDiv);
            }
        }
    }

    function showTimes(center, unit, times) {
        document.getElementById("modalUnitName").innerHTML = `${center} - ${unit}`;
        const modalList = document.getElementById("modalTimesList");
        if (!times || times.length === 0) {
            modalList.innerHTML = "<p>— لا توجد بلاغات —</p>";
        } else {
            modalList.innerHTML = times.map(t => `<p>🕒 ${t}</p>`).join("");
        }
        document.getElementById("timeModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("timeModal").style.display = "none";
    }

    // ============================================
    // التشغيل
    // ============================================
    document.getElementById("currentDate").innerText = new Date().toLocaleDateString("ar-SA");
    document.getElementById("exportBtn").onclick = exportExcel;
    document.getElementById("resetBtn").onclick = resetAll;
    window.onclick = (e) => { if (e.target === document.getElementById("timeModal")) closeModal(); };
    
    loadAllData();
</script>
</body>
</html>

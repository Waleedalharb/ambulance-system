<!-- ===== نموذج التقرير اليومي ===== -->
<!-- L-4 (اعتماد المالك 2026-09-02 — FORMS-LOOKUP-L4-SPEC.md): رقم التقرير =
     معرّف اليوم DAILY-YYYY-MM-DD (تلقائي read-only) · عدد بلاغات الجوي =
     عدد طلبات الجوي المسجلة في المنصة لهذا اليوم (تلقائي read-only) ·
     الفرق المستجيبة والمركبات تبقى يدوية (تعريفها التشغيلي غير محسوم). -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-calendar-day" style="color:var(--primary-700);"></i>
        معلومات التقرير
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-hashtag" style="color:var(--primary-700);"></i> رقم التقرير:</label>
            <input type="text" id="dailyReportNumber" readonly tabindex="-1" title="معرّف اليوم — يُولّد تلقائيًا">
            <small style="color:var(--pi-ink-dim,#9AA7C4); font-size:0.75rem;">معرّف اليوم — يُولّد تلقائيًا بالصيغة DAILY-YYYY-MM-DD.</small>
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-alt" style="color:var(--gold);"></i> التاريخ:</label>
            <input type="date" id="dailyDate">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-ambulance" style="color:var(--teal);"></i> عدد الفرق المستجيبة:</label>
            <input type="number" id="dailyResponseTeams" min="0" value="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-helicopter" style="color:var(--teal);"></i> عدد بلاغات الإسعاف الجوي:</label>
            <input type="number" id="dailyAir" min="0" value="0" readonly tabindex="-1" title="عدد طلبات الجوي المسجلة في المنصة لهذا اليوم">
            <small style="color:var(--pi-ink-dim,#9AA7C4); font-size:0.75rem;">عدد طلبات الجوي المسجلة في المنصة لهذا اليوم — يُحسب تلقائيًا.</small>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-border-all" style="color:var(--gold);"></i>
        بلاغات ومسارات
    </div>
    <div class="form-group">
        <label><i class="fas fa-border-all" style="color:var(--gold);"></i> البلاغات الحدودية:</label>
        <input type="text" id="dailyBorderReports" placeholder="مثال: 3 بلاغات حدودية">
    </div>
    <div class="form-group">
        <label><i class="fas fa-heartbeat" style="color:var(--coral);"></i> تفعيل المسارات الطبية التخصصية:</label>
        <div class="checkbox-grid">
            <label><input type="checkbox" id="dailyPath1" value="مسار الجلطات القلبية"> <span style="color:var(--coral);">❤️</span> الجلطات القلبية</label>
            <label><input type="checkbox" id="dailyPath2" value="مسار السكتات الدماغية"> <span style="color:var(--coral);">🧠</span> السكتات الدماغية</label>
            <label><input type="checkbox" id="dailyPath3" value="مسار الإصابات الخطيرة"> <span style="color:var(--coral);">🩸</span> الإصابات الخطيرة</label>
            <label><input type="checkbox" id="dailyPath4" value="مسار الحالات التنفسية"> <span style="color:var(--teal);">🫁</span> الحالات التنفسية</label>
            <label><input type="checkbox" id="dailyPath5" value="مسار الحالات العصبية"> <span style="color:var(--teal);">⚡</span> الحالات العصبية</label>
            <label><input type="checkbox" id="dailyPath6" value="مسار الحالات التوليدية"> <span style="color:var(--gold);">🤱</span> الحالات التوليدية</label>
            <label><input type="checkbox" id="dailyPath7" value="مسار الحالات النفسية"> <span style="color:var(--primary-500);">🧘</span> الحالات النفسية</label>
            <label><input type="checkbox" id="dailyPath8" value="مسار الحالات المعدية"> <span style="color:var(--primary-500);">🦠</span> الحالات المعدية</label>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-pen" style="color:var(--gray-600);"></i>
        ملاحظات
    </div>
    <div class="form-group">
        <label><i class="fas fa-edit" style="color:var(--coral);"></i> تعبئة النموذج:</label>
        <textarea id="dailyFormFill" rows="3" placeholder="أي ملاحظات أو تفاصيل إضافية عن التقرير اليومي..."></textarea>
    </div>
    <div class="form-group">
        <label><i class="fas fa-pen" style="color:var(--gray-600);"></i> ملخص التقرير:</label>
        <textarea id="dailySummary" rows="3" placeholder="ملخص التقرير اليومي..."></textarea>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearDailyForm()" class="btn btn-warning">
        <i class="fas fa-eraser"></i> مسح
    </button>
    <button onclick="saveDailyReport()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ التقرير
    </button>
    <button onclick="sendDailyWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال واتساب
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        التقارير المحفوظة
    </div>
    <div id="dailyPreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد تقارير محفوظة</p>
    </div>
</div>

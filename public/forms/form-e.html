<!-- ===== نموذج E - حالات توقف قلب وتنفس ===== -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-heartbeat" style="color:var(--coral);"></i>
        معلومات البلاغ
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-hashtag" style="color:var(--primary-700);"></i> رقم البلاغ:</label>
            <input type="text" id="eReportNumber" placeholder="مثال: 2025-E-001">
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-clock" style="color:var(--gold);"></i> تاريخ ووقت البلاغ:</label>
            <input type="datetime-local" id="eDateTime">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt" style="color:var(--coral);"></i> موقع الحالة:</label>
            <input type="text" id="eLocation" placeholder="الموقع بالتفصيل">
        </div>
        <div class="form-group">
            <label><i class="fas fa-user" style="color:var(--teal);"></i> عمر المريض:</label>
            <input type="number" id="eAge" placeholder="العمر" min="0">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-venus-mars" style="color:var(--primary-700);"></i> الجنس:</label>
            <select id="eGender">
                <option value="">-- اختر --</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="fas fa-ambulance" style="color:var(--teal);"></i> الفرقة المستجيبة:</label>
            <select id="eUnit">
                <option value="">-- اختر الفرقة --</option>
                <option value="سريع 1">سريع 1</option>
                <option value="سريع 2">سريع 2</option>
                <option value="سريع 3">سريع 3</option>
                <option value="سريع 4">سريع 4</option>
                <option value="جنوب 1">جنوب 1</option>
                <option value="جنوب 2">جنوب 2</option>
                <option value="جنوب 3">جنوب 3</option>
                <option value="جنوب 4">جنوب 4</option>
                <option value="جنوب 5">جنوب 5</option>
                <option value="جنوب 6">جنوب 6</option>
                <option value="جنوب 7">جنوب 7</option>
                <option value="جنوب 8">جنوب 8</option>
                <option value="جنوب 9">جنوب 9</option>
                <option value="جنوب 10">جنوب 10</option>
                <option value="جنوب 11">جنوب 11</option>
                <option value="جنوب 12">جنوب 12</option>
                <option value="جنوب 13">جنوب 13</option>
                <option value="جنوب 14">جنوب 14</option>
                <option value="جنوب 15">جنوب 15</option>
                <option value="جنوب 16">جنوب 16</option>
                <option value="جنوب 17">جنوب 17</option>
                <option value="جنوب 18">جنوب 18</option>
                <option value="جنوب 19">جنوب 19</option>
            </select>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-hospital" style="color:var(--coral);"></i>
        تفاصيل الحالة
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-clock" style="color:var(--gold);"></i> وقت الاستجابة (دقائق):</label>
            <input type="number" id="eResponseTime" placeholder="عدد الدقائق" min="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-hospital" style="color:var(--coral);"></i> المستشفى المستلم:</label>
            <input type="text" id="eHospital" placeholder="اسم المستشفى">
        </div>
    </div>
    <div class="form-group">
        <label><i class="fas fa-check-circle" style="color:var(--teal);"></i> الحالة النهائية:</label>
        <select id="eOutcome">
            <option value="">-- اختر --</option>
            <option value="ROSC تم الإنعاش بنجاح">ROSC تم الإنعاش بنجاح</option>
            <option value="تم النقل للمستشفى">تم النقل للمستشفى</option>
            <option value="متوفى">متوفى</option>
        </select>
    </div>
    <div class="form-group">
        <label><i class="fas fa-pen" style="color:var(--gray-600);"></i> ملاحظات:</label>
        <textarea id="eNotes" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearEForm()" class="btn btn-warning">
        <i class="fas fa-eraser"></i> مسح
    </button>
    <button onclick="saveE()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ البلاغ
    </button>
    <button onclick="sendEWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال واتساب
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        الحالات المحفوظة
    </div>
    <div id="ePreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد حالات محفوظة</p>
    </div>
</div>

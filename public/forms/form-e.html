<!-- ===== نموذج E - حالات توقف قلب وتنفس ===== -->
<!-- L-2 (اعتماد المالك 2026-09-02 — FORMS-LOOKUP-L2-SPEC.md): رقم البلاغ أصبح
     بحثًا موثّقًا عبر مكوّن IncidentLookup (L-1) — بيانات CAD تُعرض read-only
     بوسم «من CAD»، والفرقة تُختار من مشاركات البلاغ الفعلية المحتسبة فقط.
     زمن الاستجابة لم يعد حقلًا يدويًا: يُعرض من الحساب المركزي للفرقة المختارة. -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-heartbeat" style="color:var(--coral);"></i>
        معلومات البلاغ
    </div>
    <div id="eIncidentLookup"></div>
    <div class="form-row-grid" style="margin-top:12px;">
        <div class="form-group">
            <label><i class="fas fa-calendar-clock" style="color:var(--gold);"></i> تاريخ ووقت البلاغ: <span class="e-cad-tag">من CAD</span></label>
            <input type="datetime-local" id="eDateTime" readonly tabindex="-1" title="يُعبأ تلقائيًا من بيانات البلاغ الموثّق">
        </div>
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt" style="color:var(--coral);"></i> موقع الحالة: <span class="e-cad-tag">من CAD</span></label>
            <input type="text" id="eLocation" readonly tabindex="-1" placeholder="يُعبأ تلقائيًا من بيانات البلاغ الموثّق" title="يُعبأ تلقائيًا من بيانات البلاغ الموثّق">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-user" style="color:var(--teal);"></i> عمر المريض:</label>
            <input type="number" id="eAge" placeholder="العمر" min="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-venus-mars" style="color:var(--primary-700);"></i> الجنس:</label>
            <select id="eGender">
                <option value="">-- اختر --</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label><i class="fas fa-ambulance" style="color:var(--teal);"></i> الفرقة المستجيبة الفعلية:</label>
        <select id="eUnit" disabled>
            <option value="">-- ابحث عن البلاغ أولًا --</option>
        </select>
        <small style="color:var(--pi-ink-dim,#9AA7C4); font-size:0.75rem;">تُملأ من الفرق التي باشرت البلاغ فعليًا — الملغاة/المسحوبة لا تُختار.</small>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-hospital" style="color:var(--coral);"></i>
        تفاصيل الحالة
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-clock" style="color:var(--gold);"></i> وقت الاستجابة (دقائق):</label>
            <div id="eResponseTimeView" class="e-response-view" style="padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:var(--text-muted,#9aa3b2);font-size:.95rem;">— سيظهر من CAD بعد تحديد الفرقة</div>
        </div>
        <div class="form-group">
            <label><i class="fas fa-hospital" style="color:var(--coral);"></i> المستشفى المستلم:</label>
            <input type="text" id="eHospital" placeholder="اسم المستشفى">
        </div>
    </div>
    <div class="form-group">
        <label><i class="fas fa-check-circle" style="color:var(--teal);"></i> الحالة النهائية:</label>
        <select id="eOutcome">
            <option value="">-- اختر --</option>
            <option value="ROSC تم الإنعاش بنجاح">ROSC تم الإنعاش بنجاح</option>
            <option value="تم النقل للمستشفى">تم النقل للمستشفى</option>
            <option value="متوفى">متوفى</option>
        </select>
    </div>
    <div class="form-group">
        <label><i class="fas fa-pen" style="color:var(--gray-600);"></i> ملاحظات:</label>
        <textarea id="eNotes" rows="2" placeholder="أي ملاحظات إضافية..."></textarea>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearEForm()" class="btn btn-warning">
        <i class="fas fa-eraser"></i> مسح
    </button>
    <button onclick="saveE()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ البلاغ
    </button>
    <button onclick="sendEWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال واتساب
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        الحالات المحفوظة
    </div>
    <div id="ePreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد حالات محفوظة</p>
    </div>
</div>

<!-- AI Assistant -->

<script src="/js/time-riyadh.js"></script>
<script src="../js/ai-assistant.js?v=2"></script>

<!-- ===== نموذج التصعيد ===== -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-arrow-up" style="color:var(--coral);"></i>
        معلومات البلاغ
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-hashtag" style="color:var(--primary-700);"></i> رقم البلاغ:</label>
            <input type="text" id="escReportNumber" placeholder="مثال: 2025-ESC-001">
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-clock" style="color:var(--gold);"></i> تاريخ ووقت البلاغ:</label>
            <input type="datetime-local" id="escDateTime">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt" style="color:var(--coral);"></i> موقع البلاغ:</label>
            <input type="text" id="escLocation" placeholder="الموقع بالتفصيل">
        </div>
        <div class="form-group">
            <label><i class="fas fa-exclamation-triangle" style="color:var(--coral);"></i> نوع الحدث:</label>
            <select id="escEventType">
                <option value="">-- اختر نوع الحدث --</option>
                <option value="كارثة طبيعية">كارثة طبيعية</option>
                <option value="حادث تصادم مروري">حادث تصادم مروري</option>
                <option value="حريق">حريق</option>
                <option value="إصابة في المدارس">إصابة في المدارس</option>
                <option value="إصابة رياضية">إصابة رياضية</option>
                <option value="حالة طارئة صحية">حالة طارئة صحية</option>
                <option value="حادث عمل">حادث عمل</option>
                <option value="غرق">غرق</option>
                <option value="انهيار مبنى">انهيار مبنى</option>
                <option value="تلوث كيميائي">تلوث كيميائي</option>
                <option value="حادث كهربائي">حادث كهربائي</option>
                <option value="عنف أسري">عنف أسري</option>
                <option value="اعتداء">اعتداء</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-chart-bar" style="color:var(--teal);"></i>
        إحصائيات
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-users" style="color:var(--teal);"></i> عدد المصابين:</label>
            <input type="number" id="escInjuries" min="0" value="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-user-injured" style="color:var(--coral);"></i> عدد الوفيات:</label>
            <input type="number" id="escDeaths" min="0" value="0">
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-building" style="color:var(--primary-500);"></i>
        الجهات المشاركة (اختياري)
    </div>
    <div class="form-group">
        <div class="checkbox-grid">
            <label><input type="checkbox" class="esc-agency" value="وزارة الصحة"> وزارة الصحة</label>
            <label><input type="checkbox" class="esc-agency" value="الإسعاف الجوي"> الإسعاف الجوي</label>
            <label><input type="checkbox" class="esc-agency" value="الدفاع المدني"> الدفاع المدني</label>
            <label><input type="checkbox" class="esc-agency" value="الدوريات الأمنية"> الدوريات الأمنية</label>
            <label><input type="checkbox" class="esc-agency" value="أمن الطرق"> أمن الطرق</label>
            <label><input type="checkbox" class="esc-agency" value="المرور"> المرور</label>
            <label><input type="checkbox" class="esc-agency" value="أمانة الرياض (شرشورة)"> أمانة الرياض (شرشورة)</label>
            <label><input type="checkbox" class="esc-agency" value="الهلال الأحمر"> الهلال الأحمر</label>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-pen" style="color:var(--gray-600);"></i>
        التفاصيل
    </div>
    <div class="form-group">
        <label><i class="fas fa-pen" style="color:var(--gray-600);"></i> تفاصيل البلاغ:</label>
        <textarea id="escDetails" rows="3" placeholder="التفاصيل الكاملة للبلاغ..."></textarea>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearEscalationForm()" class="btn btn-warning">
        <i class="fas fa-eraser"></i> مسح
    </button>
    <button onclick="saveEscalation()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ البلاغ
    </button>
    <button onclick="sendEscalationWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال واتساب
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        البلاغات المحفوظة
    </div>
    <div id="escalationPreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد بلاغات محفوظة</p>
    </div>
</div>

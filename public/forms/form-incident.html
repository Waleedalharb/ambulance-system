<!-- ===== نموذج بلاغ حادث ===== -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-car-crash" style="color:var(--primary-700);"></i>
        معلومات البلاغ
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-hashtag" style="color:var(--primary-700);"></i> رقم البلاغ</label>
            <input type="text" id="incReportNumber" placeholder="E-2025-XXXX">
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-clock" style="color:var(--gold);"></i> التاريخ والوقت</label>
            <input type="datetime-local" id="incDateTime">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-exclamation-circle" style="color:var(--coral);"></i> نوع الحادث</label>
            <select id="incType">
                <option value="">-- اختر --</option>
                <option value="تصادم مروري">تصادم مروري</option>
                <option value="دهس">دهس</option>
                <option value="انقلاب مركبة">انقلاب مركبة</option>
                <option value="حريق">حريق</option>
                <option value="غرق">غرق</option>
                <option value="سقوط من ارتفاع">سقوط من ارتفاع</option>
                <option value="إصابة عمل">إصابة عمل</option>
                <option value="عنف">عنف</option>
                <option value="حالة طبية طارئة">حالة طبية طارئة</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt" style="color:var(--coral);"></i> الموقع</label>
            <input type="text" id="incLocation" placeholder="حي / شارع">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-ambulance" style="color:var(--teal);"></i> الفرقة</label>
            <select id="incUnit">
                <option value="">-- اختر الفرقة --</option>
                <option value="سريع 1">سريع 1</option>
                <option value="سريع 2">سريع 2</option>
                <option value="سريع 3">سريع 3</option>
                <option value="سريع 4">سريع 4</option>
                <option value="جنوب 1">جنوب 1</option>
                <option value="جنوب 2">جنوب 2</option>
                <option value="جنوب 3">جنوب 3</option>
                <option value="جنوب 4">جنوب 4</option>
                <option value="جنوب 5">جنوب 5</option>
                <option value="جنوب 6">جنوب 6</option>
                <option value="جنوب 7">جنوب 7</option>
                <option value="جنوب 8">جنوب 8</option>
                <option value="جنوب 9">جنوب 9</option>
                <option value="جنوب 10">جنوب 10</option>
                <option value="جنوب 11">جنوب 11</option>
                <option value="جنوب 12">جنوب 12</option>
                <option value="جنوب 13">جنوب 13</option>
                <option value="جنوب 14">جنوب 14</option>
                <option value="جنوب 15">جنوب 15</option>
                <option value="جنوب 16">جنوب 16</option>
                <option value="جنوب 17">جنوب 17</option>
                <option value="جنوب 18">جنوب 18</option>
                <option value="جنوب 19">جنوب 19</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="fas fa-hospital" style="color:var(--teal);"></i> المركز</label>
            <select id="incCenter">
                <option value="">-- اختر المركز --</option>
                <option value="المنصورة">المنصورة</option>
                <option value="الشيخ زايد">الشيخ زايد</option>
                <option value="حي الواحات">حي الواحات</option>
                <option value="المناخ">المناخ</option>
                <option value="المريوطية">المريوطية</option>
                <option value="طرة">طرة</option>
                <option value="مطرية">مطرية</option>
                <option value="البساتين">البساتين</option>
                <option value="الخليفة">الخليفة</option>
                <option value="الشفاء">الشفاء</option>
                <option value="عكاظ">عكاظ</option>
                <option value="الدار البيضاء">الدار البيضاء</option>
                <option value="طريق الملك فهد">طريق الملك فهد</option>
                <option value="مستشفى الملك خالد">مستشفى الملك خالد</option>
            </select>
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-user-injured" style="color:var(--coral);"></i>
        معلومات المريض
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-user" style="color:var(--primary-700);"></i> اسم المريض</label>
            <input type="text" id="incPatientName" placeholder="الاسم الكامل">
        </div>
        <div class="form-group">
            <label><i class="fas fa-users" style="color:var(--teal);"></i> العمر</label>
            <input type="number" id="incAge" placeholder="العمر" min="0">
        </div>
    </div>
    <div class="form-group">
        <label><i class="fas fa-venus-mars" style="color:var(--primary-700);"></i> الجنس</label>
        <select id="incGender">
            <option value="">-- اختر --</option>
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
        </select>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-notes-medical" style="color:var(--coral);"></i>
        تفاصيل الحالة
    </div>
    <div class="form-group">
        <label><i class="fas fa-stethoscope" style="color:var(--coral);"></i> وصف الحالة</label>
        <textarea id="incDescription" rows="3" placeholder="وصف تفصيلي للحالة..."></textarea>
    </div>
    <div class="form-group">
        <label><i class="fas fa-procedures" style="color:var(--teal);"></i> الإجراءات المتخذة</label>
        <textarea id="incActions" rows="3" placeholder="الإجراءات الأولية..."></textarea>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearIncidentForm()" class="btn btn-danger">
        <i class="fas fa-times"></i> إلغاء
    </button>
    <button onclick="saveIncident()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ
    </button>
    <button onclick="sendIncidentWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        البلاغات المحفوظة
    </div>
    <div id="incidentPreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد بلاغات محفوظة</p>
    </div>
</div>

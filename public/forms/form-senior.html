<!-- ===== نموذج تسليم مناوبة كبار المسعفين ===== -->
<div class="form-card">
    <div class="form-card-title" style="background:linear-gradient(135deg, #8B5CF6, #A78BFA); color:white; border-radius:8px 8px 0 0; padding:14px 18px; margin:-20px -20px 20px -20px;">
        <i class="fas fa-user-md"></i>
        تسجيل بيانات المناوبة لكبار المسعفين
    </div>
    
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-car" style="color:var(--teal);"></i> عدد المركبات العاملة</label>
            <input type="number" id="senWorkingCars" placeholder="0" min="0" value="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-car-crash" style="color:var(--coral);"></i> عدد المركبات المتعطلة</label>
            <input type="number" id="senBrokenCars" placeholder="0" min="0" value="0">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-car-side" style="color:var(--gold);"></i> عدد مركبات الاحتياط</label>
            <input type="number" id="senReserveCars" placeholder="0" min="0" value="0">
        </div>
        <div class="form-group">
            <label><i class="fas fa-layer-group" style="color:var(--primary-700);"></i> عدد فرق الاوفر لاب</label>
            <input type="number" id="senOverlapTeams" placeholder="0" min="0" value="0">
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-map-marker-alt" style="color:var(--primary-700);"></i>
        مناطق تمركز فرق الاوفر لاب (اختياري)
    </div>
    <div class="form-checkbox-group" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:8px;">
        <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="senAreaShifa" value="الشفاء">
            <span>الشفاء</span>
        </label>
        <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="senAreaOkaz" value="عكاظ">
            <span>عكاظ</span>
        </label>
        <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="senAreaDar" value="الدار البيضاء">
            <span>الدار البيضاء</span>
        </label>
        <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="senAreaIskan" value="الإسكان">
            <span>الإسكان</span>
        </label>
        <label style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; cursor:pointer; font-size:0.85rem;">
            <input type="checkbox" id="senAreaMansoura" value="المنصورة">
            <span>المنصورة</span>
        </label>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-sticky-note" style="color:var(--coral);"></i>
        ملاحظات إضافية
    </div>
    <div class="form-group">
        <textarea id="senNotes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title" style="background:linear-gradient(135deg, #1E3A5F, #2563EB); color:white; border-radius:8px 8px 0 0; padding:14px 18px; margin:-20px -20px 20px -20px;">
        <i class="fas fa-handshake"></i>
        التسليم والاستلام
    </div>
    
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;">
        <div style="background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:16px;">
            <div style="font-weight:700; color:var(--gray-800); margin-bottom:12px; font-size:0.95rem;">
                <i class="fas fa-user-nurse" style="color:var(--primary-700);"></i> مساعد كبير المسعفين
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">الاسم</label>
                <input type="text" id="senAsstName" placeholder="الاسم الكامل">
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">التوقيع (اختياري)</label>
                <input type="text" id="senAsstSign" placeholder="التوقيع">
            </div>
            <div class="form-group">
                <label style="font-size:0.75rem;">التاريخ</label>
                <input type="date" id="senAsstDate">
            </div>
        </div>
        
        <div style="background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:16px;">
            <div style="font-weight:700; color:var(--gray-800); margin-bottom:12px; font-size:0.95rem;">
                <i class="fas fa-user-md" style="color:var(--teal);"></i> كبير المسعفين
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">الاسم</label>
                <input type="text" id="senChiefName" placeholder="الاسم الكامل">
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">التوقيع (اختياري)</label>
                <input type="text" id="senChiefSign" placeholder="التوقيع">
            </div>
            <div class="form-group">
                <label style="font-size:0.75rem;">التاريخ</label>
                <input type="date" id="senChiefDate">
            </div>
        </div>
        
        <div style="background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:16px;">
            <div style="font-weight:700; color:var(--gray-800); margin-bottom:12px; font-size:0.95rem;">
                <i class="fas fa-user-tie" style="color:var(--gold);"></i> قائد المنطقة
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">الاسم</label>
                <input type="text" id="senCmdrName" placeholder="الاسم الكامل">
            </div>
            <div class="form-group" style="margin-bottom:10px;">
                <label style="font-size:0.75rem;">التوقيع (اختياري)</label>
                <input type="text" id="senCmdrSign" placeholder="التوقيع">
            </div>
            <div class="form-group">
                <label style="font-size:0.75rem;">التاريخ</label>
                <input type="date" id="senCmdrDate">
            </div>
        </div>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearSeniorForm()" class="btn btn-danger">
        <i class="fas fa-times"></i> إلغاء
    </button>
    <button onclick="saveSenior()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ
    </button>
    <button onclick="sendSeniorWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-history" style="color:var(--primary-700);"></i>
        المناوبات المحفوظة
    </div>
    <div id="seniorPreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد مناوبات محفوظة</p>
    </div>
</div>

<!-- ===== نموذج الإسعاف الجوي ===== -->
<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-plane-medical" style="color:var(--primary-700);"></i>
        معلومات البلاغ
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-hashtag" style="color:var(--primary-700);"></i> رقم البلاغ:</label>
            <input type="text" id="airReportNumber" placeholder="مثال: 2025-AIR-001">
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar-clock" style="color:var(--gold);"></i> تاريخ ووقت الطلب:</label>
            <input type="datetime-local" id="airDateTime">
        </div>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-hospital" style="color:var(--teal);"></i>
        تفاصيل النقل
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt" style="color:var(--coral);"></i> موقع الإخلاء:</label>
            <input type="text" id="airPickupLocation" placeholder="نقطة الإخلاء">
        </div>
        <div class="form-group">
            <label><i class="fas fa-hospital" style="color:var(--teal);"></i> المستشفى الوجهة:</label>
            <input type="text" id="airDestinationHospital" placeholder="المستشفى">
        </div>
    </div>
    <div class="form-group">
        <label><i class="fas fa-user-injured" style="color:var(--coral);"></i> تشخيص الحالة:</label>
        <input type="text" id="airDiagnosis" placeholder="التشخيص">
    </div>
    <div class="form-group">
        <label><i class="fas fa-pen" style="color:var(--gray-600);"></i> سبب الطلب:</label>
        <textarea id="airReason" rows="2" placeholder="سبب طلب النقل الجوي..."></textarea>
    </div>
</div>

<div class="form-card">
    <div class="form-card-title">
        <i class="fas fa-user" style="color:var(--primary-700);"></i>
        معلومات المريض والفرقة
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-user" style="color:var(--primary-700);"></i> اسم المريض:</label>
            <input type="text" id="airPatientName" placeholder="الاسم">
        </div>
        <div class="form-group">
            <label><i class="fas fa-users" style="color:var(--teal);"></i> العمر:</label>
            <input type="number" id="airPatientAge" min="0" placeholder="العمر">
        </div>
    </div>
    <div class="form-row-grid">
        <div class="form-group">
            <label><i class="fas fa-ambulance" style="color:var(--primary-700);"></i> الفرقة:</label>
            <select id="airUnit">
                <option value="">-- اختر الفرقة --</option>
                <option value="سريع 1">سريع 1</option>
                <option value="سريع 2">سريع 2</option>
                <option value="سريع 3">سريع 3</option>
                <option value="سريع 4">سريع 4</option>
                <option value="جنوب 1">جنوب 1</option>
                <option value="جنوب 2">جنوب 2</option>
                <option value="جنوب 3">جنوب 3</option>
                <option value="جنوب 4">جنوب 4</option>
                <option value="جنوب 5">جنوب 5</option>
                <option value="جنوب 6">جنوب 6</option>
                <option value="جنوب 7">جنوب 7</option>
                <option value="جنوب 8">جنوب 8</option>
                <option value="جنوب 9">جنوب 9</option>
                <option value="جنوب 10">جنوب 10</option>
                <option value="جنوب 11">جنوب 11</option>
                <option value="جنوب 12">جنوب 12</option>
                <option value="جنوب 13">جنوب 13</option>
                <option value="جنوب 14">جنوب 14</option>
                <option value="جنوب 15">جنوب 15</option>
                <option value="جنوب 16">جنوب 16</option>
                <option value="جنوب 17">جنوب 17</option>
                <option value="جنوب 18">جنوب 18</option>
                <option value="جنوب 19">جنوب 19</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="fas fa-user-nurse" style="color:var(--primary-700);"></i> المسعف:</label>
            <input type="text" id="airParamedic" placeholder="اسم المسعف">
        </div>
    </div>
</div>

<div class="form-actions">
    <button onclick="clearAirForm()" class="btn btn-warning">
        <i class="fas fa-eraser"></i> مسح
    </button>
    <button onclick="saveAirAmbulance()" class="btn btn-primary">
        <i class="fas fa-save"></i> حفظ الطلب
    </button>
    <button onclick="sendAirWhatsApp()" class="btn btn-success">
        <i class="fab fa-whatsapp"></i> إرسال واتساب
    </button>
</div>

<div class="form-card" style="margin-top:16px; background:var(--gray-50);">
    <div class="form-card-title">
        <i class="fas fa-eye" style="color:var(--primary-700);"></i>
        الطلبات المحفوظة
    </div>
    <div id="airPreviewList" style="max-height:300px; overflow-y:auto;">
        <p style="text-align:center; color:var(--gray-400); padding:20px;">📭 لا توجد طلبات محفوظة</p>
    </div>
</div>

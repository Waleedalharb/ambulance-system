<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>الدردشة – منصة إدارة العمليات الإسعافية</title>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1E3A5F">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/a11y.css?v=1">

    <!-- Chat Styles -->
    <link rel="stylesheet" href="css/chat.css?v=3">
    <!-- الهوية البصرية الموحدة (شاشة التكميل) — تُحمَّل بعد أنماط الصفحة -->
    <link rel="stylesheet" href="/css/platform-identity.css?v=1">
    <style>
    /* ═══ PLATFORM IDENTITY — هوية التكميل الموحدة ═══ */
    /* chat.css خارجي لا يُعدَّل — نجسر رموزه ونكسر أسطحه الفاتحة من هنا.
       فقاعتا الإرسال/الاستقبال تحتفظان بدلالتهما بلغة داكنة:
       المُرسَل = أزرق تنفيذي متدرج، المُستقبَل = زجاجي شفاف.
       بصري فقط — لا منطق ولا id ولا بنية. */
    :root {
        /* جسر كتلة --chat-* */
        --chat-sidebar: #0D1730;
        --chat-sidebar-hover: rgba(255,255,255,0.05);
        --chat-sidebar-active: rgba(96,165,250,0.16);
        --chat-sidebar-border: rgba(255,255,255,0.09);
        --chat-sidebar-text: #9AA7C4;
        --chat-sidebar-text-light: #E8EDF8;
        --chat-area: #0B1226;
        --chat-area-border: rgba(255,255,255,0.09);
        --chat-sent: linear-gradient(150deg, #2F6BF0, #1D4FD7);
        --chat-sent-text: #FFFFFF;
        --chat-received: rgba(255,255,255,0.07);
        --chat-received-text: #E8EDF8;
        --chat-online: #34D399;
        --chat-unread-bg: #F87171;
        --chat-typing: #6B7899;
        /* جسر كتلة v3 الثانية */
        --primary: #2F6BF0; --primary-light: #60A5FA; --primary-50: rgba(96,165,250,0.10);
        --text: #E8EDF8; --text-muted: #9AA7C4;
        --gray-50: rgba(255,255,255,0.045); --gray-100: rgba(255,255,255,0.06);
        --gray-200: rgba(255,255,255,0.09); --gray-300: rgba(255,255,255,0.14);
        --gray-400: #6B7899; --gray-500: #9AA7C4;
        --sent-bg: rgba(47,107,240,0.16);
        --online: #34D399;
    }
    /* أسطح فاتحة مضمّنة → زجاج التكميل */
    .chat-header, .chat-input-area {
        background: linear-gradient(170deg, rgba(17,25,48,0.94), rgba(9,14,28,0.94));
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .chat-header-back { color: var(--pi-ink-dim); }
    .chat-header-back:hover, .chat-header-action:hover { background: rgba(255,255,255,0.06); color: var(--pi-ink); }
    .chat-header-avatar { background: linear-gradient(150deg, #2F6BF0, #1D4FD7); }
    .chat-header-avatar .avatar-status, .conversation-avatar .avatar-status { border-color: #0B1226; }
    .chat-input-wrap { background: rgba(255,255,255,0.05); border: 1px solid var(--pi-line); }
    .chat-empty h2 { color: var(--pi-ink); }
    .chat-empty p { color: var(--pi-ink-dim); }
    .chat-empty-icon { background: rgba(96,165,250,0.12); color: var(--pi-blue); }
    .user-item:hover { background: rgba(255,255,255,0.04); }
    .selected-users { background: rgba(255,255,255,0.04); border-color: var(--pi-line); }
    .message-context-menu { background: #101B30; border: 1px solid var(--pi-line); box-shadow: 0 18px 40px rgba(2,6,18,0.5); }
    .reply-bar { background: rgba(96,165,250,0.08); border-top-color: var(--pi-line); }
    /* اسم المُرسِل داخل فقاعة الاستقبال — زمردي قديم → إشاري التكميل */
    .message-bubble .message-sender { color: var(--pi-green); }
    /* زر الإرسال — إجراء أساسي → التدرج الأزرق التنفيذي */
    .chat-input-btn.send-btn {
        background: linear-gradient(150deg, #2F6BF0, #1D4FD7);
        box-shadow: 0 8px 18px rgba(30,90,220,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Shared core modules (auth/toast/time) -->
    <script src="js/core/core-auth.js"></script>
    <script src="js/core/core-toast.js"></script>
    <script src="/js/time-riyadh.js"></script>
    <script src="js/core/core-time.js"></script>

    <!-- Auth Check -->
    <script>
        (function() {
            var token = AuthCore.getToken();
            if (!token) {
                location.href = 'index.html';
            }
        })();
    </script>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Mobile Sidebar Toggle -->
    <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" title="القائمة">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Main Chat Layout -->
    <div class="chat-layout" id="chatLayout">
        <!-- Sidebar -->
        <aside class="chat-sidebar" id="chatSidebar">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img src="logo.png" alt="logo" class="sidebar-logo">
                    <div class="sidebar-title">
                        <span class="sidebar-title-main">المراسلات</span>
                        <span class="sidebar-title-sub">نظام التواصل الداخلي</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="sidebar-action-btn" id="newChatBtn" title="محادثة جديدة">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="sidebar-action-btn" id="newGroupBtn" title="مجموعة جديدة">
                        <i class="fas fa-users"></i>
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="sidebar-search">
                <i class="fas fa-search"></i>
                <input type="text" id="conversationSearch" placeholder="البحث في المحادثات..." autocomplete="off">
            </div>

            <!-- Conversation List -->
            <div class="sidebar-list" id="conversationList">
                <div class="sidebar-empty">
                    <i class="fas fa-inbox"></i>
                    <span>لا توجد محادثات</span>
                </div>
            </div>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="currentUserAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="sidebar-user-info">
                        <span class="sidebar-user-name" id="currentUserName">جاري التحميل...</span>
                        <span class="sidebar-user-status">
                            <span class="status-dot online"></span>
                            متصل
                        </span>
                    </div>
                </div>
                <button class="sidebar-action-btn" onclick="toggleSettings()" title="الإعدادات">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="sidebar-action-btn" onclick="location.href='index.html'" title="الرئيسية">
                    <i class="fas fa-home"></i>
                </button>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-main" id="chatMain">
            <!-- Empty State -->
            <div class="chat-empty" id="chatEmpty">
                <div class="chat-empty-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h2>مرحباً بك في نظام المراسلات</h2>
                <p>اختر محادثة من القائمة أو ابدأ محادثة جديدة</p>
                <button class="btn btn-primary" onclick="document.getElementById('newChatBtn').click()">
                    <i class="fas fa-plus"></i> محادثة جديدة
                </button>
            </div>

            <!-- Active Chat -->
            <div class="chat-active" id="chatActive" style="display:none;">
                <!-- Chat Header -->
                <div class="chat-header" id="chatHeader">
                    <button class="chat-header-back" id="chatHeaderBack" title="رجوع">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <div class="chat-header-avatar" id="chatHeaderAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="chatHeaderName">-</div>
                        <div class="chat-header-status" id="chatHeaderStatus">
                            <span class="status-dot online"></span>
                            <span id="chatHeaderStatusText">متصل</span>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="chat-header-action" id="chatHeaderSearch" title="بحث">
                            <i class="fas fa-search"></i>
                        </button>
                        <button class="chat-header-action" id="chatHeaderInfo" title="معلومات">
                            <i class="fas fa-info-circle"></i>
                        </button>
                    </div>
                </div>

                <!-- Messages Area -->
                <div class="chat-messages" id="chatMessages">
                    <div class="messages-loader" id="messagesLoader" style="display:none;">
                        <div class="spinner"></div>
                        <span>جاري التحميل...</span>
                    </div>
                    <div class="messages-list" id="messagesList"></div>
                    <div class="typing-indicator" id="typingIndicator" style="display:none;">
                        <div class="typing-bubble">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                        <span class="typing-text" id="typingText">يكتب...</span>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area" id="chatInputArea">
                    <div class="chat-input-wrap" id="messageInputWrap">
                        <button class="chat-input-btn attach-btn" id="attachBtn" title="إرفاق ملف">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <div class="chat-input-field">
                            <textarea id="messageInput" placeholder="اكتب رسالتك..." rows="1" autocomplete="off"></textarea>
                        </div>
                        <button class="chat-input-btn send-btn" id="sendBtn" title="إرسال">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- New Chat Modal (User Search) -->
    <div class="modal" id="newChatModal" style="display:none;">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus"></i> محادثة جديدة</h3>
                <button class="modal-close" onclick="closeModal('newChatModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="user-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="userSearchInput" placeholder="البحث عن مستخدم..." autocomplete="off">
                </div>
                <div class="user-list" id="userList"></div>
            </div>
        </div>
    </div>

    <!-- New Group Modal -->
    <div class="modal" id="newGroupModal" style="display:none;">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3><i class="fas fa-users"></i> مجموعة جديدة</h3>
                <button class="modal-close" onclick="closeModal('newGroupModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>اسم المجموعة</label>
                    <input type="text" id="groupTitleInput" placeholder="مثال: فريق الطوارئ">
                </div>
                <div class="form-group">
                    <label>اختر الأعضاء</label>
                    <div class="user-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="groupUserSearchInput" placeholder="البحث عن مستخدمين..." autocomplete="off">
                    </div>
                    <div class="user-list user-list-selectable" id="groupUserList"></div>
                </div>
                <div class="form-group">
                    <label>المختارون (<span id="selectedCount">0</span>)</label>
                    <div class="selected-users" id="selectedUsers"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('newGroupModal')">إلغاء</button>
                <button class="btn btn-primary" id="createGroupBtn">
                    <i class="fas fa-check"></i> إنشاء المجموعة
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" style="display:none;"></div>

    <!-- Auth Manager: fetch ملفوف (حقن التوكن تلقائياً + تجديد 401) -->
    <script src="/js/auth-manager.js"></script>
    <!-- Chat Logic -->
    <script src="js/chat.js?v=3"></script>
</body>
</html>
